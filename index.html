<script>const BANK=[{"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "מה המשמעות של 18 וולט (Volt) על סוללת מברגה?", "qe": "What does 18 V on a drill battery mean?", "ah": "זה \"הלחץ\" של החשמל. יותר וולט בדרך כלל אומר מנוע חזק יותר.", "ae": "It is the electrical \"pressure\". More volts usually means a stronger motor.", "oh": ["הלחץ החשמלי שהסוללה נותנת", "כמה זמן הסוללה מחזיקה בשעות", "כמה סיבובים בדקה עושה המנוע"], "oe": ["The electrical pressure it supplies", "How many hours the battery lasts", "How many turns a minute the motor does"], "id": 1}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "מה אומר 2 אמפר-שעה (Ah) על הסוללה?", "qe": "What does 2 Ah on a battery mean?", "ah": "כמה חשמל נכנס בה. 4Ah תחזיק בערך פי 2 זמן מ-2Ah באותה עבודה.", "ae": "How much charge it holds. 4 Ah lasts about twice as long as 2 Ah for the same job.", "oh": ["כמה חשמל הסוללה מחזיקה", "כמה חזק המנוע יכול לסובב", "כמה מהר הסוללה נטענת"], "oe": ["How much charge it stores", "How hard the motor can twist", "How fast the battery charges"], "id": 2}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "למה כמעט כל המברגות היום עם סוללת ליתיום (Li-ion)?", "qe": "Why do almost all drills use Li-ion batteries now?", "ah": "קלה, מחזיקה הרבה חשמל, ולא מאבדת טעינה מהר כשהיא על המדף.", "ae": "Light, stores a lot, and does not lose charge quickly on the shelf.", "oh": ["קלה ומחזיקה הרבה חשמל", "זולה בהרבה מכל סוג סוללה אחר", "אפשר לטעון אותה גם בלי מטען"], "oe": ["Light and stores a lot of energy", "Much cheaper than any other battery", "Can be charged without a charger"], "id": 3}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "מה קורה למהירות המנוע כשהסוללה כמעט ריקה?", "qe": "What happens to motor speed when the battery is almost empty?", "ah": "הוולט יורד, אז המנוע מסתובב לאט יותר ונותן פחות כוח.", "ae": "The voltage drops, so the motor turns slower and gives less force.", "oh": ["יורדת, כי הוולט יורד", "עולה, כי יש פחות עומס בסוללה", "נשארת בדיוק אותו דבר עד הסוף"], "oe": ["Drops, because voltage drops", "Rises, since the battery has less load", "Stays exactly the same until the end"], "id": 4}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "מה תפקיד ההדק (Trigger) במברגה מודרנית?", "qe": "What does the trigger do in a modern drill?", "ah": "לוחצים חלש – מהירות נמוכה, לוחצים חזק – מהירות מלאה. בקר קטן מווסת את החשמל.", "ae": "Light press – slow, full press – full speed. A small controller meters the power.", "oh": ["משנה מהירות לפי כמה לוחצים", "רק מדליק ומכבה, בלי שום ביניים", "מחליף בין שני הילוכים של התמסורת"], "oe": ["Changes speed by how far you press", "Only on and off, nothing between", "Switches between the two gear ranges"], "id": 5}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "למה לא כדאי להשאיר סוללת ליתיום ריקה לגמרי חודשים?", "qe": "Why not leave a Li-ion battery fully empty for months?", "ah": "היא יכולה להתרוקן מתחת לגבול הבטוח ולהיפגע. עדיף לשמור אותה חצי טעונה.", "ae": "It can drain below the safe limit and get damaged. Store it about half full.", "oh": ["היא עלולה להיפגע לצמיתות", "היא תתפוצץ מיד אחרי יום אחד", "זה בכלל לא משנה לסוללה"], "oe": ["It may be permanently damaged", "It will explode after one day", "It makes no difference at all"], "id": 6}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "הספק (Power) של מנוע הוא בעצם…", "qe": "Motor power is really…", "ah": "כוח הסיבוב כפול המהירות. אותו הספק יכול להיות מהיר וחלש או איטי וחזק.", "ae": "Twisting force times speed. The same power can be fast-and-weak or slow-and-strong.", "oh": ["כוח סיבוב כפול מהירות", "רק כמה מהר המנוע מסתובב", "רק כמה חזק המנוע מסובב"], "oe": ["Twisting force times speed", "Only how fast the motor turns", "Only how hard the motor twists"], "id": 7}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "מנוע 500 ואט (Watt) ונצילות 80%. כמה ואט יוצאים לבורג?", "qe": "500 W motor at 80% efficiency – how many watts reach the screw?", "ah": "80% מ-500 זה 400 ואט. 100 ואט הולכים לחום.", "ae": "80% of 500 is 400 W. 100 W turns into heat.", "oh": ["400 ואט", "580 ואט", "420 ואט"], "oe": ["400 W", "580 W", "420 W"], "id": 8}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "לאן הולכת האנרגיה שלא מגיעה לבורג?", "qe": "Where does the energy that misses the screw go?", "ah": "בעיקר לחום: בסלילים של המנוע, בחיכוך בגלגלי השיניים ובמסבים, וקצת לרעש.", "ae": "Mostly heat: in the motor windings, gear friction and bearings, plus a little noise.", "oh": ["בעיקר לחום ורעש", "חוזרת לטעון את הסוללה", "נעלמת בלי להשאיר שום סימן"], "oe": ["Mostly heat and noise", "It recharges the battery", "It vanishes without a trace"], "id": 9}, {"topic": "מברגה · סוללות וחשמל (Batteries & Power)", "type": "mcq", "qh": "למה מברגה נעשית חמה בעבודה כבדה וארוכה?", "qe": "Why does a drill get hot during long heavy work?", "ah": "בעומס גבוה המנוע מושך הרבה חשמל, וחלק גדול ממנו הופך לחום בסלילים.", "ae": "Under high load the motor draws lots of current, and much of it becomes heat in the windings.", "oh": ["זרם גבוה מחמם את הסלילים", "הסוללה מחממת את הגוף בכוונה", "המאוורר מכניס אוויר חם מבחוץ"], "oe": ["High current heats the windings", "The battery heats the body on purpose", "The fan blows in hot outside air"], "id": 10}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "ממה עושים בדרך כלל את גלגלי השיניים האחרונים, החזקים?", "qe": "What are the last, strongest gears usually made of?", "ah": "פלדה (Steel), לפעמים מוקשחת. הם סוחבים את הכוח הכי גדול.", "ae": "Steel, often hardened. They carry the biggest force.", "oh": ["פלדה, לעיתים מוקשחת", "פלסטיק רך כדי להוריד רעש", "אלומיניום רך כדי לחסוך משקל"], "oe": ["Steel, often hardened", "Soft plastic to cut noise", "Soft aluminium to save weight"], "id": 11}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "מה זה הקשחה (Hardening) של פלדה?", "qe": "What is hardening of steel?", "ah": "מחממים מאוד ומקררים מהר. הפלדה נעשית קשה ועמידה לשחיקה, אבל גם שבירה יותר.", "ae": "Heat it very hot and cool it fast. It gets hard and wear-resistant, but more brittle.", "oh": ["חימום וקירור מהיר שמקשים", "צביעה בשכבה של צבע קשה במיוחד", "הוספת פלסטיק לתוך הפלדה"], "oe": ["Heating then fast cooling to harden", "Painting with an extra-hard paint", "Mixing plastic into the steel"], "id": 12}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "מה זה הקשחת שטח (Case Hardening)?", "qe": "What is case hardening?", "ah": "רק השכבה החיצונית נעשית קשה, והפנים נשאר גמיש. השן לא נשחקת וגם לא נשברת.", "ae": "Only the outer skin gets hard; the core stays tough. The tooth resists wear and does not snap.", "oh": ["רק השכבה החיצונית מוקשחת", "כל החלק נעשה קשה מבפנים ומבחוץ", "מצפים את החלק בגומי עבה"], "oe": ["Only the outer layer is hardened", "The whole part is hard inside and out", "The part is coated in thick rubber"], "id": 13}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "למה גוף המברגה עשוי פלסטיק (Plastic) ולא מתכת?", "qe": "Why is the drill body plastic, not metal?", "ah": "קל, זול ליצור בתבנית, ומבודד חשמל ביד.", "ae": "Light, cheap to mould, and insulates electricity from the hand.", "oh": ["קל, זול ומבודד חשמל", "חזק יותר מכל מתכת שקיימת", "מעביר חום טוב יותר ממתכת"], "oe": ["Light, cheap and insulating", "Stronger than any metal there is", "Moves heat better than metal"], "id": 14}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "למה תיבת ההילוכים במברגות חזקות עשויה לפעמים ממתכת?", "qe": "Why is the gearbox housing sometimes metal in strong drills?", "ah": "מתכת קשיחה יותר, שומרת על הגלגלים במקום תחת עומס, ומוציאה חום טוב יותר.", "ae": "Metal is stiffer, keeps gears aligned under load, and sheds heat better.", "oh": ["קשיחה יותר ומוציאה חום", "זולה יותר מפלסטיק בכל כמות", "שקטה יותר כי היא רכה"], "oe": ["Stiffer and sheds heat", "Cheaper than plastic at any volume", "Quieter because it is soft"], "id": 15}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "למה המקדחים (Drill Bits) עשויים פלדה מהירה (HSS)?", "qe": "Why are drill bits made of high-speed steel (HSS)?", "ah": "היא נשארת קשה גם כשהיא מתחממת מאוד בחיתוך.", "ae": "It stays hard even when cutting makes it very hot.", "oh": ["נשארת קשה גם כשהיא חמה", "היא הכי קלה מכל המתכות", "היא לא מחלידה אף פעם בכלל"], "oe": ["Stays hard even when hot", "It is the lightest metal", "It never rusts at all"], "id": 16}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "מה החיסרון של חומר מאוד קשה?", "qe": "What is the downside of a very hard material?", "ah": "הוא שביר יותר. מכה חזקה יכולה לסדוק אותו במקום לכופף.", "ae": "It is more brittle. A sharp hit can crack it instead of bending it.", "oh": ["שביר יותר במכה", "נשחק מהר יותר מחומר רך", "אי אפשר בכלל לייצר ממנו"], "oe": ["More brittle under impact", "Wears faster than a soft one", "Cannot be manufactured at all"], "id": 17}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "למה שמים גריז (Grease) בתוך תיבת ההילוכים?", "qe": "Why put grease inside the gearbox?", "ah": "מוריד חיכוך ושחיקה, מקרר קצת, ומשקיט את הרעש.", "ae": "Cuts friction and wear, cools a bit, and quietens noise.", "oh": ["מוריד חיכוך, שחיקה ורעש", "מדביק את הגלגלים כדי שלא יזוזו", "מבודד את המנוע מהחשמל"], "oe": ["Cuts friction, wear and noise", "Glues the gears so they stay put", "Insulates the motor electrically"], "id": 18}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "מה זה מגנט ניאודימיום (Neodymium) במנועים ללא מברשות?", "qe": "What is a neodymium magnet in brushless motors?", "ah": "מגנט קבוע חזק מאוד. מאפשר מנוע קטן וחזק.", "ae": "A very strong permanent magnet. It allows a small, strong motor.", "oh": ["מגנט קבוע חזק מאוד", "סליל נחושת שמחליף מברשות", "חיישן שמודד את החום"], "oe": ["A very strong permanent magnet", "A copper coil that replaces brushes", "A sensor that measures heat"], "id": 19}, {"topic": "מברגה · חומרים וטיפול בחום (Materials & Heat Treatment)", "type": "mcq", "qh": "למה הסלילים במנוע עשויים נחושת (Copper)?", "qe": "Why are motor windings copper?", "ah": "נחושת מעבירה חשמל טוב מאוד, אז פחות אנרגיה הולכת לחום.", "ae": "Copper conducts very well, so less energy is lost as heat.", "oh": ["מעבירה חשמל טוב מאוד", "היא המתכת הכי חזקה שיש", "היא מגנטית יותר מברזל"], "oe": ["Conducts electricity very well", "It is the strongest metal there is", "It is more magnetic than iron"], "id": 20}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "מה הסימן הנפוץ לשן שבורה בתמסורת?", "qe": "Common sign of a broken gear tooth?", "ah": "נקישה קבועה פעם בסיבוב, ולפעמים קפיצה או החלקה.", "ae": "A regular click once per turn, sometimes a jump or slip.", "oh": ["נקישה קבועה פעם בסיבוב", "המנוע מסתובב מהר יותר מהרגיל", "הסוללה נטענת לאט יותר"], "oe": ["A regular click once per turn", "The motor spins faster than usual", "The battery charges more slowly"], "id": 21}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "מה זה עייפות חומר (Fatigue)?", "qe": "What is material fatigue?", "ah": "סדק קטן שגדל אחרי הרבה מאוד מחזורים של עומס, גם אם כל עומס לבד קטן.", "ae": "A small crack that grows after very many load cycles, even if each load is small.", "oh": ["סדק שגדל מעומס חוזר", "חלק שנמס מחום גבוה מאוד", "חלודה שנוצרת ממים"], "oe": ["A crack growing from repeated load", "A part melting from great heat", "Rust that forms from water"], "id": 22}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "ריח שרוף מהמברגה – מה הסיבה הסבירה?", "qe": "Burning smell from the drill – likely cause?", "ah": "המנוע התחמם מעומס יתר והבידוד בסלילים או המברשות נשרפים.", "ae": "The motor overheated from overload; winding insulation or brushes are burning.", "oh": ["המנוע התחמם מעומס יתר", "הגריז בתיבה פשוט ישן מדי", "הצ׳אק סגור חזק מדי על המקדח"], "oe": ["The motor overheated from overload", "The gearbox grease is simply old", "The chuck is gripping the bit too hard"], "id": 23}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "איך בודקים שהמצמד (Clutch) מכויל נכון?", "qe": "How do you check the clutch is calibrated?", "ah": "מחברים מד מומנט (Torque Meter) ובודקים שבכל מספר המצמד מחליק בכוח הנכון.", "ae": "Use a torque meter and check each setting slips at the right force.", "oh": ["במד מומנט, לכל מספר", "שוקלים את המברגה על משקל", "סופרים כמה בורגים נכנסו בשעה"], "oe": ["With a torque meter, per setting", "Weigh the drill on a scale", "Count screws driven per hour"], "id": 24}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "מה זה בדיקת חיים (Life Test)?", "qe": "What is a life test?", "ah": "מפעילים את המוצר שוב ושוב, הרבה פעמים, כדי לראות מתי ומה נשבר.", "ae": "Run the product again and again, many times, to see what fails and when.", "oh": ["הפעלה חוזרת עד שמשהו נשבר", "בדיקה של הצבע והמראה בלבד", "מדידה של המשקל הכולל בלבד"], "oe": ["Repeated running until something fails", "Checking only paint and looks", "Measuring only the total weight"], "id": 25}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "למה המברשות במנוע עם מברשות נשחקות?", "qe": "Why do brushes wear in a brushed motor?", "ah": "הן משתפשפות כל הזמן על חלק מסתובב ומעבירות חשמל עם ניצוצות קטנים.", "ae": "They rub on a spinning part all the time and pass current with small sparks.", "oh": ["שפשוף קבוע וניצוצות", "הן נמסות מהחום של הסוללה", "הן מחלידות מלחות באוויר"], "oe": ["Constant rubbing and sparks", "They melt from battery heat", "They rust from air humidity"], "id": 26}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "המברגה רועדת כשהמקדח מסתובב. מה לבדוק קודם?", "qe": "The drill wobbles as the bit turns. What to check first?", "ah": "שהמקדח ישר ויושב עמוק ומרכזי בצ׳אק. מקדח עקום הוא הסיבה הכי נפוצה.", "ae": "That the bit is straight and seated deep and centred in the chuck. A bent bit is the most common cause.", "oh": ["שהמקדח ישר ויושב טוב בצ׳אק", "את מספר הוולטים של הסוללה", "שהמנוע מקבל מספיק זרם מהסוללה בעומס"], "oe": ["That the bit is straight and seated", "The battery voltage rating", "That the motor gets enough battery current under load"], "id": 27}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "מה קורה לשן שמקבלת מכה חזקה פעם אחת?", "qe": "What happens to a tooth hit hard once?", "ah": "אם המכה גבוהה מהחוזק, השן יכולה להישבר מיד. זה שונה מעייפות.", "ae": "If the hit is above its strength, it can snap at once. That is different from fatigue.", "oh": ["יכולה להישבר מיד", "תמיד רק נשחקת לאט", "שום דבר, שיניים לא נשברות"], "oe": ["It can snap at once", "It always just wears slowly", "Nothing, teeth never break"], "id": 28}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "מה ההבדל בין שחיקה (Wear) לשבר (Fracture)?", "qe": "Wear vs fracture?", "ah": "שחיקה: חומר יורד לאט מהשטח. שבר: החלק נסדק ונפרד.", "ae": "Wear: material slowly rubs off the surface. Fracture: the part cracks apart.", "oh": ["שחיקה איטית מול סדק ופירוק", "שתי מילים לאותו דבר בדיוק", "שחיקה קורית רק בפלסטיק, שבר רק במתכת קשה"], "oe": ["Slow rub-off vs cracking apart", "Two words for exactly the same", "Wear happens only in plastic, fracture only in hard metal"], "id": 29}, {"topic": "מברגה · כשלים ובדיקות (Failures & Testing)", "type": "mcq", "qh": "למה בודקים מברגה גם בקור וגם בחום?", "qe": "Why test a drill in both cold and heat?", "ah": "בקור הגריז סמיך והסוללה חלשה. בחום המנוע והסוללה מתחממים מהר.", "ae": "In cold the grease thickens and the battery weakens; in heat the motor and battery overheat fast.", "oh": ["גריז, סוללה ומנוע משתנים בטמפרטורה", "כדי לבדוק אם הצבע משנה צבע", "כדי לבדוק שהצבע והמדבקות לא מתקלפים בשינויי מזג אוויר"], "oe": ["Grease, battery and motor change with temperature", "To see if the paint changes colour", "To check paint and labels don't peel in weather changes"], "id": 30}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "איך מייצרים בכמות גדולה גלגלי שיניים מפלסטיק?", "qe": "How are plastic gears mass-produced?", "ah": "בהזרקה (Injection Moulding): פלסטיק חם נדחף לתבנית. כל גלגל לוקח שניות.", "ae": "Injection moulding: hot plastic is pushed into a mould. Each gear takes seconds.", "oh": ["הזרקה לתבנית", "חיתוך ידני בסכין", "הדפסה בתלת מימד"], "oe": ["Injection moulding", "Cutting by hand with a knife", "3D printing"], "id": 31}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "איך מייצרים גלגלי שיניים מפלדה?", "qe": "How are steel gears made?", "ah": "בדרך כלל חותכים את השיניים במכונה מיוחדת (Hobbing), או מכבישים אבקת מתכת (Sintering).", "ae": "Usually the teeth are cut on a special machine (hobbing), or metal powder is pressed and baked (sintering).", "oh": ["חיתוך במכונה או אבקת מתכת", "יציקה בתבנית של פלסטיק רך", "כיפוף של פח דק עד שנוצרות שיניים"], "oe": ["Machine cutting or powder metal", "Casting in a soft plastic mould", "Bending thin sheet into teeth"], "id": 32}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "מה זה טולרנס (Tolerance)?", "qe": "What is a tolerance?", "ah": "כמה מותר למידה לסטות. למשל 10 מ\"מ, פלוס מינוס 0.05 מ\"מ.", "ae": "How much a size may vary. E.g. 10 mm, plus or minus 0.05 mm.", "oh": ["כמה מותר למידה לסטות", "כמה כוח החלק יכול לשאת", "כמה זמן לוקח לייצר חלק"], "oe": ["How much a size may vary", "How much force a part can carry", "How long a part takes to make"], "id": 33}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "למה לא מבקשים טולרנס קטן מאוד בכל החלקים?", "qe": "Why not ask for very tight tolerance on every part?", "ah": "זה מייקר מאוד את הייצור. נותנים טולרנס צר רק איפה שהוא באמת חשוב.", "ae": "It makes manufacturing very expensive. Tight tolerance only where it really matters.", "oh": ["זה מייקר מאוד את הייצור", "החלקים יהיו חלשים יותר ככה", "אי אפשר למדוד חלקים קטנים"], "oe": ["It makes production very expensive", "The parts would be weaker that way", "Small parts cannot be measured"], "id": 34}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "מה זה התאמת לחץ (Press Fit)?", "qe": "What is a press fit?", "ah": "חור קצת קטן מהציר. דוחפים בכוח, והחלקים נתפסים בלי בורג.", "ae": "The hole is slightly smaller than the shaft. Push in hard and they hold with no screw.", "oh": ["חור קטן מעט מהציר", "בורג שמהדק שני חלקים", "דבק שמחזיק את הציר"], "oe": ["A hole slightly smaller than the shaft", "A screw clamping two parts", "Glue holding the shaft"], "id": 35}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "למה שמים שני חצאי גוף (Clamshell) עם ברגים?", "qe": "Why a two-half body (clamshell) with screws?", "ah": "קל להרכיב: מניחים את כל החלקים בחצי אחד וסוגרים. גם קל לפתוח לתיקון.", "ae": "Easy to assemble: drop parts into one half and close it. Also easy to open for repair.", "oh": ["קל להרכיב ולפתוח לתיקון", "זה הכי חזק מכל צורה אחרת", "אין צורך בכלל בברגים אחר כך"], "oe": ["Easy to assemble and open for repair", "It is stronger than any other shape", "No screws are needed afterwards"], "id": 36}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "מה זה תכנון להרכבה (Design for Assembly)?", "qe": "What is design for assembly?", "ah": "מתכננים כך שיהיו מעט חלקים, שנכנסים רק בדרך אחת, ובקלות.", "ae": "Design so there are few parts that fit only one way, easily.", "oh": ["מעט חלקים שנכנסים רק בדרך אחת", "הרבה חלקים קטנים כדי לחסוך חומר", "חלקים שמתאימים בכל כיוון שהוא"], "oe": ["Few parts that fit only one way", "Many small parts to save material", "Parts that fit in any direction"], "id": 37}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "למה הגלגלים בשלב הראשון מפלסטיק ובאחרון מפלדה?", "qe": "Why plastic gears in the first stage and steel in the last?", "ah": "בשלב הראשון הכוח קטן והמהירות גבוהה – פלסטיק שקט מספיק. בסוף הכוח גדול.", "ae": "First stage: small force, high speed – quiet plastic is enough. The end carries big force.", "oh": ["הכוח קטן בהתחלה וגדול בסוף", "הפלסטיק עמיד יותר בחום גבוה", "הפלדה שקטה יותר מפלסטיק"], "oe": ["Force is small at start, big at end", "Plastic resists heat better", "Steel is quieter than plastic"], "id": 38}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "מה זה פוקה-יוקה (Poka-Yoke)?", "qe": "What is poka-yoke?", "ah": "עיצוב שמונע טעות בהרכבה. למשל חלק עם בליטה שלא נכנס הפוך.", "ae": "Design that prevents assembly mistakes, e.g. a tab so a part cannot go in backwards.", "oh": ["עיצוב שמונע טעות בהרכבה", "שם של סוג מיוחד של פלדה", "שיטה לצבוע חלקים מהר"], "oe": ["Design that prevents assembly errors", "Name of a special steel type", "A way to paint parts fast"], "id": 39}, {"topic": "מברגה · ייצור והרכבה (Manufacturing & Assembly)", "type": "mcq", "qh": "מה זה עלות לחלק (Unit Cost) ולמה תבנית יקרה עדיין משתלמת?", "qe": "What is unit cost, and why can an expensive mould still pay off?", "ah": "תבנית יכולה לעלות 50,000 ש״ח, אבל אם מייצרים 500,000 חלקים, זה 10 אגורות לחלק.", "ae": "A mould may cost 50,000, but over 500,000 parts that is 0.1 per part.", "oh": ["מחלקים את המחיר על הרבה חלקים", "התבנית מחזירה כסף ממכירה שלה", "תבנית יקרה מקצרת את זמן ההרכבה של כל מוצר ולכן משתלמת"], "oe": ["Its price is shared over many parts", "The mould pays back by selling it", "An expensive mould shortens assembly time of every product"], "id": 40}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "מה ההבדל בין כוח (Force) למומנט (Torque)?", "qe": "Force vs torque?", "ah": "כוח דוחף בקו ישר. מומנט הוא כוח סיבוב: כוח כפול המרחק מהציר.", "ae": "Force pushes in a line. Torque is twisting force: force times distance from the axis.", "oh": ["מומנט הוא כוח כפול מרחק מהציר", "מומנט הוא כוח כפול המהירות שבה הציר מסתובב", "אין שום הבדל בין השניים"], "oe": ["Torque is force times distance from axis", "Torque is force times the speed the shaft turns", "There is no difference"], "id": 41}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "ידית באורך כפול, אותו כוח ביד – מה קורה למומנט?", "qe": "Handle twice as long, same hand force – torque?", "ah": "המומנט גדל פי 2.", "ae": "Torque doubles.", "oh": ["גדל פי 2", "קטן פי 2", "גדל פי 4"], "oe": ["Doubles", "Halves", "Grows 4×"], "id": 42}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "יחידה של מומנט היא…", "qe": "Unit of torque is…", "ah": "ניוטון-מטר (Nm). 10 ניוטון על ידית של מטר אחד = 10 Nm.", "ae": "Newton-metre (Nm). 10 N on a 1 m handle = 10 Nm.", "oh": ["ניוטון-מטר (Nm)", "ואט (W)", "סיבובים לדקה"], "oe": ["Newton-metre (Nm)", "Watt (W)", "Turns per minute"], "id": 43}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "מה זה מקדם ביטחון (Safety Factor)?", "qe": "What is a safety factor?", "ah": "מתכננים חלק חזק יותר ממה שצריך. מקדם 2 אומר שהוא יחזיק פי 2 מהעומס הצפוי.", "ae": "Design stronger than needed. Factor 2 means it holds twice the expected load.", "oh": ["כמה פעמים חזק יותר מהנדרש", "כמה פעמים זול יותר מהמתוכנן", "אחוז החלקים שעוברים בדיקה"], "oe": ["How many times stronger than needed", "How many times cheaper than planned", "Share of parts passing inspection"], "id": 44}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "איך היית בוחר בין מנוע עם מברשות לבלי מברשות למוצר זול?", "qe": "Brushed or brushless for a cheap product?", "ah": "לרוב עם מברשות: זול ופשוט. בלי מברשות שווה כשצריך חיים ארוכים ויעילות.", "ae": "Usually brushed: cheap and simple. Brushless pays off when long life and efficiency matter.", "oh": ["לרוב עם מברשות, כי זה זול", "תמיד בלי מברשות, בכל מחיר", "אין הבדל, אז מטילים מטבע"], "oe": ["Usually brushed, as it is cheap", "Always brushless, at any price", "No difference, so flip a coin"], "id": 45}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "מה זה עומס יתר (Overload) ואיך מגנים מפניו?", "qe": "What is overload and how to protect against it?", "ah": "יותר כוח ממה שהמערכת בנויה לו. מגנים עם מצמד מחליק, נתיך, או בקר שמנתק זרם.", "ae": "More force than the system is built for. Protect with a slipping clutch, fuse, or a controller that cuts current.", "oh": ["מצמד מחליק, נתיך או ניתוק זרם", "מגדילים את הסוללה פי שתיים כדי שיהיה מספיק כוח", "מוסיפים עוד גריז לתיבה"], "oe": ["Slipping clutch, fuse or current cut-off", "Double the battery so there's enough power", "Add more grease to the gearbox"], "id": 46}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "למה עדיף שהמצמד יחליק לפני שהשיניים נשברות?", "qe": "Why should the clutch slip before teeth break?", "ah": "מצמד שמחליק לא נהרס וחוזר לעבוד. שן שבורה דורשת תיקון.", "ae": "A slipping clutch is not damaged and keeps working. A broken tooth needs repair.", "oh": ["החלקה לא הורסת כלום", "כך המברגה מהירה יותר", "כך הסוללה נטענת בזמן"], "oe": ["Slipping destroys nothing", "The drill gets faster that way", "The battery charges meanwhile"], "id": 47}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "מה זה FMEA?", "qe": "What is FMEA?", "ah": "רשימה של כל מה שיכול להישבר, כמה זה חמור, ואיך מונעים את זה מראש.", "ae": "A list of everything that can fail, how bad it is, and how to prevent it upfront.", "oh": ["ניתוח מה יכול להיכשל ואיך מונעים", "שיטה לתעד את שלבי ההרכבה במפעל לפי סדר", "בדיקה של מחיר החלקים בשוק"], "oe": ["Analysing what can fail and how to prevent it", "A method to document assembly steps in order", "A check of parts prices on the market"], "id": 48}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "מנוע 20,000 סל\"ד, יחס 50:1. כמה סל\"ד בצ׳אק?", "qe": "Motor 20,000 rpm, ratio 50:1. Chuck rpm?", "ah": "20,000 חלקי 50 = 400 סיבובים בדקה.", "ae": "20,000 divided by 50 = 400 rpm.", "oh": ["400 סל\"ד", "4,000 סל\"ד", "1,000 סל\"ד"], "oe": ["400 rpm", "4,000 rpm", "1,000 rpm"], "id": 49}, {"topic": "מברגה · שאלות ראיון כלליות (General Interview)", "type": "mcq", "qh": "איך היית מסביר למישהו לא טכני מה עושה תמסורת?", "qe": "How would you explain a gearbox to a non-technical person?", "ah": "כמו הילוכים באופניים: הילוך קל – מסובבים הרבה ולאט מתקדמים, אבל קל לדווש.", "ae": "Like bike gears: a low gear – pedal a lot and move slowly, but it is easy to push.", "oh": ["כמו הילוכים באופניים", "כמו מתג של אור בבית", "כמו ווסת מתח שמוריד את הוולטים בבית"], "oe": ["Like bicycle gears", "Like a light switch at home", "Like a voltage regulator lowering the voltage at home"], "id": 50}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "מה הבעיה של דיפרנציאל פתוח (Open Differential) כשגלגל אחד על בוץ?", "qe": "Problem of an open diff with one wheel in mud?", "ah": "הכוח הולך לגלגל שהכי קל לסובב. הגלגל בבוץ מסתובב סתם והרכב לא זז.", "ae": "Power goes to the wheel that is easiest to turn. The mud wheel spins and the car stays put.", "oh": ["הגלגל בבוץ מסתובב והרכב תקוע", "שני הגלגלים נעצרים מיד", "הגלגל על הכביש מסתובב מהר יותר"], "oe": ["The mud wheel spins, the car is stuck", "Both wheels stop at once", "The wheel on the road spins faster"], "id": 51}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "מה עושה נעילת דיפרנציאל (Diff Lock)?", "qe": "What does a diff lock do?", "ah": "מחברת את שני הגלגלים כך שיסתובבו יחד באותה מהירות, כמו ציר אחד.", "ae": "Ties both wheels so they turn together at the same speed, like one axle.", "oh": ["שני הגלגלים מסתובבים יחד", "מנתקת את המנוע מהגלגלים", "עוצרת את הרכב כמו בלם יד"], "oe": ["Both wheels turn together", "Disconnects the engine from the wheels", "Stops the car like a handbrake"], "id": 52}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "למה לא נוסעים עם נעילה על כביש יבש בסיבובים?", "qe": "Why not drive locked on dry road in turns?", "ah": "בסיבוב הגלגלים צריכים מהירות שונה. נעול – הם נגררים, נשחקים, וההיגוי קשה.", "ae": "In a turn the wheels need different speeds. Locked, they scrub, wear and steering fights you.", "oh": ["הגלגלים נגררים וההיגוי קשה", "המנוע נכבה בכל פעם שמסובבים את ההגה חזק", "הבלמים מפסיקים לעבוד"], "oe": ["The tyres scrub and steering fights", "The engine stalls whenever you turn the wheel hard", "The brakes stop working"], "id": 53}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "מה זה דיפרנציאל מוגבל החלקה (LSD – Limited Slip)?", "qe": "What is a limited-slip differential?", "ah": "מאפשר הבדל מהירות, אבל כשגלגל אחד מחליק הוא מעביר יותר כוח לגלגל השני.", "ae": "Allows speed difference, but when one wheel slips it sends more force to the other.", "oh": ["מעביר כוח לגלגל שאוחז", "נועל את שני הגלגלים תמיד", "מוריד כוח משני הגלגלים"], "oe": ["Sends force to the gripping wheel", "Locks both wheels all the time", "Cuts force to both wheels"], "id": 54}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "איך עובד LSD עם דסקיות (Clutch-type)?", "qe": "How does a clutch-type LSD work?", "ah": "דסקיות חיכוך נלחצות בין הצד לבית. כשיש הבדל מהירות, החיכוך מעביר כוח לגלגל האיטי.", "ae": "Friction discs press between side gear and case. When speeds differ, friction sends force to the slower wheel.", "oh": ["דסקיות חיכוך בין הצד לבית", "מגנט חשמלי שמחבר את הגלגלים", "משאבת שמן שדוחפת את הגלגל"], "oe": ["Friction discs between side and case", "An electromagnet joining the wheels", "An oil pump that pushes the wheel"], "id": 55}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "מה זה דיפרנציאל טורסן (Torsen)?", "qe": "What is a Torsen differential?", "ah": "משתמש בגלגלי שיניים מסוג תולעת שקשה לסובב מהצד, ולכן מעביר כוח לגלגל שאוחז. בלי דסקיות.", "ae": "Uses worm-type gears that are hard to back-drive, so it shifts force to the gripping wheel. No discs.", "oh": ["גלגלי תולעת שמעבירים כוח", "דסקיות חיכוך עם קפיצים שנשחקות עם הזמן", "חיישן ומחשב בלבד"], "oe": ["Worm gears that shift force", "Friction plates with springs that wear over time", "Only a sensor and computer"], "id": 56}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "איזה חיסרון יש לטורסן כשגלגל אחד ממש באוויר?", "qe": "Torsen weakness when one wheel is in the air?", "ah": "הוא מכפיל את הכוח של הגלגל החלש. אם לגלגל באוויר אין התנגדות, כמעט אין כוח לשני.", "ae": "It multiplies the weak wheel's force. If the airborne wheel has no resistance, the other gets almost nothing.", "oh": ["גלגל באוויר – כמעט אין כוח לשני", "הוא ננעל לגמרי ושולח את כל הכוח לגלגל שבאוויר", "הוא נועל ולא נותן לנסוע"], "oe": ["Wheel in air – little force to the other", "It locks fully and sends all power to the airborne wheel", "It locks and will not let you drive"], "id": 57}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "איך רכבים מודרניים \"מחקים\" נעילה בלי חלקים נוספים?", "qe": "How do modern cars mimic a locker without extra parts?", "ah": "בלמים על הגלגל שמחליק (Brake-based Traction Control). הבלימה גורמת לכוח לעבור לגלגל השני.", "ae": "They brake the slipping wheel (brake-based traction control), so force goes to the other wheel.", "oh": ["בולמים את הגלגל שמחליק", "מגדילים את כוח המנוע מאוד", "מנפחים את הצמיג אוטומטית"], "oe": ["Brake the slipping wheel", "Raise engine power a lot", "Inflate the tyre automatically"], "id": 58}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "למה LSD פופולרי במכוניות ספורט?", "qe": "Why is LSD popular in sports cars?", "ah": "ביציאה חזקה מסיבוב הגלגל הפנימי מתרומם קצת ומחליק. LSD שולח כוח לגלגל החיצוני.", "ae": "Accelerating hard out of a turn, the inner wheel lightens and slips. LSD sends force to the outer wheel.", "oh": ["שולח כוח לגלגל החיצוני ביציאה", "מקטין את משקל הרכב ומשפר את צריכת הדלק בעיר", "מאפשר להחליף הילוך בלי מצמד"], "oe": ["Sends force to the outer wheel on exit", "Cuts car weight and improves city fuel use", "Lets you shift without a clutch"], "id": 59}, {"topic": "דיפרנציאל · נעילה ודיפרנציאל מוגבל החלקה (Lockers & LSD)", "type": "mcq", "qh": "למה צריך שמן מיוחד ל-LSD עם דסקיות?", "qe": "Why does a clutch-type LSD need special oil?", "ah": "צריך תוסף חיכוך (Friction Modifier) כדי שהדסקיות יחליקו חלק ולא ירעדו ויקרקשו.", "ae": "It needs a friction modifier so the discs slip smoothly instead of chattering.", "oh": ["כדי שהדסקיות לא ירעדו ויקרקשו", "כדי שהשמן לא יתאדה בקיץ", "כדי שהשמן לא יתאדה בקיץ ולא יקפא בחורף"], "oe": ["So the discs do not chatter", "So the oil does not evaporate", "So the oil won't evaporate in summer or freeze in winter"], "id": 60}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "למה שמן הדיפרנציאל סמיך יותר משמן מנוע?", "qe": "Why is diff oil thicker than engine oil?", "ah": "בגלגלים הקוניים יש לחץ והחלקה גבוהים מאוד בין השיניים. שמן סמיך עם תוספים מחזיק שכבה.", "ae": "The bevel gears have very high pressure and sliding between teeth. Thick oil with additives keeps a film.", "oh": ["לחץ והחלקה גבוהים בין השיניים", "כי אין צורך לקרר את הדיפרנציאל", "כדי שיעלה פחות כסף לייצר"], "oe": ["High pressure and sliding between teeth", "Because the diff needs no cooling", "So it is cheaper to make"], "id": 61}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "מה זה שמן היפואיד (Hypoid Oil / GL-5)?", "qe": "What is hypoid (GL-5) oil?", "ah": "שמן עם תוספי לחץ גבוה (EP) לגלגלי היפואיד, שבהם השיניים מחליקות הרבה.", "ae": "Oil with extreme-pressure (EP) additives for hypoid gears, where teeth slide a lot.", "oh": ["שמן עם תוספי לחץ גבוה", "שמן מנוע רגיל שמחליפים כל 10,000 ק\"מ", "מים עם מעט סבון"], "oe": ["Oil with extreme-pressure additives", "Ordinary engine oil changed every 10,000 km", "Water with a little soap"], "id": 62}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "איך השמן מגיע לגלגלים בדיפרנציאל בלי משאבה?", "qe": "How does oil reach the diff gears with no pump?", "ah": "גלגל הכתר טובל בשמן בתחתית ומתיז אותו על כל השאר (Splash Lubrication).", "ae": "The ring gear dips into oil at the bottom and splashes it everywhere (splash lubrication).", "oh": ["גלגל הכתר טובל ומתיז", "מאוורר מפזר אותו באוויר", "הנהג מוסיף שמן בכל נסיעה"], "oe": ["The ring gear dips and splashes", "A fan spreads it in the air", "The driver adds oil every trip"], "id": 63}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "מה תפקיד אטם השמן (Oil Seal) בכניסה ובצירים?", "qe": "What does the oil seal at input and axles do?", "ah": "שפת גומי שלוחצת על הציר המסתובב. שומרת שמן בפנים ולכלוך בחוץ.", "ae": "A rubber lip pressing on the spinning shaft. Keeps oil in and dirt out.", "oh": ["שומר שמן בפנים ולכלוך בחוץ", "מחזיק את הציר שלא יזוז הצידה", "מודד את כמות השמן בבית"], "oe": ["Keeps oil in and dirt out", "Holds the shaft from moving sideways", "Measures the oil level in the case"], "id": 64}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "למה יש פתח נשימה (Breather) בבית הדיפרנציאל?", "qe": "Why does the diff case have a breather?", "ah": "השמן והאוויר מתחממים ומתרחבים. בלי פתח, הלחץ דוחף שמן החוצה דרך האטמים.", "ae": "Oil and air heat up and expand. Without a vent, pressure pushes oil out past the seals.", "oh": ["לחץ מחום ידחוף שמן דרך האטמים", "כדי שהנהג ישמע את הגלגלים", "כדי להכניס אוויר קר שמקרר את גלגלי השיניים"], "oe": ["Heat pressure would push oil past seals", "So the driver can hear the gears", "To let in cool air that cools the gears"], "id": 65}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "למה פתח הנשימה בג׳יפים מוארך עד גבוה?", "qe": "Why is the breather on off-roaders extended up high?", "ah": "כדי שבחציית מים לא ייכנסו מים לבית. מים בשמן הורסים את המסבים.", "ae": "So crossing water does not let water in. Water in oil ruins bearings.", "oh": ["כדי שמים לא ייכנסו בחציית נחל", "כדי שהשמן יתקרר מהר יותר בנסיעה בשטח חם", "זה רק קישוט שנראה טוב"], "oe": ["So water stays out when wading", "So the oil cools faster in hot off-road driving", "It is only for looks"], "id": 66}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "איך יודעים שיש מספיק שמן בדיפרנציאל?", "qe": "How do you know the diff has enough oil?", "ah": "פותחים את פקק המילוי בצד. השמן צריך להגיע בדיוק לשפת החור.", "ae": "Open the side fill plug. The oil should reach the lip of the hole.", "oh": ["השמן מגיע לשפת פתח המילוי", "מסתכלים על נורה בלוח השעונים", "שוקלים את כל הרכב"], "oe": ["Oil reaches the fill hole lip", "Look for a dashboard light", "Weigh the whole car"], "id": 67}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "למה פותחים קודם את פקק המילוי ורק אחר כך את פקק הריקון?", "qe": "Why open the fill plug before the drain plug?", "ah": "אם פקק המילוי תקוע, לפחות הרכב לא נשאר בלי שמן ובלי דרך למלא.", "ae": "If the fill plug is stuck, at least the car is not left empty with no way to refill.", "oh": ["כדי לא להישאר ריק בלי דרך למלא", "כי ככה השמן יוצא חם יותר ומהר יותר מהבית", "אין סיבה, זה סתם הרגל"], "oe": ["So you are not left empty with no way to refill", "Because the oil then drains hotter and faster", "No reason, it is just habit"], "id": 68}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "למה יש מגנט על פקק הריקון?", "qe": "Why is there a magnet on the drain plug?", "ah": "הוא אוסף שבבי ברזל קטנים מהשחיקה, כדי שלא יסתובבו בשמן.", "ae": "It collects tiny iron wear particles so they do not circulate in the oil.", "oh": ["אוסף שבבי ברזל מהשחיקה", "מחזיק את הפקק נעול כדי שלא ישתחרר ברעידות", "מודד את מהירות הגלגל"], "oe": ["Collects iron wear particles", "Holds the plug locked so vibration won't loosen it", "Measures wheel speed"], "id": 69}, {"topic": "דיפרנציאל · שמן ואיטום (Oil & Sealing)", "type": "mcq", "qh": "שמן כהה עם ברק מתכתי חזק בהחלפה. מה זה אומר?", "qe": "Dark oil with heavy metallic glitter at change. Meaning?", "ah": "כנראה שחיקה חזקה של גלגלים או מסבים. כדאי לבדוק לפני שמשהו נשבר.", "ae": "Probably heavy gear or bearing wear. Check before something fails.", "oh": ["כנראה שחיקה של גלגלים או מסבים", "זה סימן שהשמן חדש ואיכותי", "זה סימן לתוספים טובים שעובדים כמו שצריך"], "oe": ["Likely gear or bearing wear", "A sign the oil is new and good", "It shows good additives doing their job"], "id": 70}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "איזה מסב מחזיק את גלגל הפיניון (Pinion) בדרך כלל?", "qe": "Which bearing usually supports the pinion?", "ah": "זוג מסבי חרוט (Tapered Roller Bearings). הם מחזיקים גם עומס צדדי וגם עומס לאורך.", "ae": "A pair of tapered roller bearings. They carry both side load and end load.", "oh": ["זוג מסבי חרוט", "תותב פלסטיק פשוט", "מסב כדורים קטן אחד"], "oe": ["A pair of tapered roller bearings", "A simple plastic bushing", "One small ball bearing"], "id": 71}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "למה הפיניון נדחף לאורך הציר כשמעביר כוח?", "qe": "Why is the pinion pushed along its axis under load?", "ah": "השיניים הקוניות לוחצות באלכסון, אז חלק מהכוח דוחף את הפיניון קדימה או אחורה.", "ae": "Bevel teeth press at a slant, so part of the force pushes the pinion fore or aft.", "oh": ["השיניים הקוניות לוחצות באלכסון", "כי השמן בלחץ בתוך הבית דוחף אותו קדימה", "כי הוא כבד יותר מגלגל הכתר"], "oe": ["Bevel teeth press at a slant", "Because pressurised oil in the housing pushes it forward", "Because it is heavier than the ring"], "id": 72}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "מה זה עומס מוקדם (Preload) במסבים?", "qe": "What is bearing preload?", "ah": "מהדקים את המסבים קצת מראש כדי שלא יהיה רווח. הפיניון לא זז ולא רועש.", "ae": "Squeeze the bearings slightly in advance so there is no play. The pinion stays put and quiet.", "oh": ["לחץ קטן מראש שמבטל רווח", "שמן שמכניסים לפני ההרכבה", "משקל שמוסיפים לגלגל הכתר"], "oe": ["A small pre-squeeze that removes play", "Oil added before assembly", "Weight added to the ring gear"], "id": 73}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "מה קורה אם ה-Preload חזק מדי?", "qe": "What if the preload is too high?", "ah": "המסבים מתחממים ונשחקים מהר. אם חלש מדי – רעש ושחיקה של השיניים.", "ae": "The bearings run hot and wear fast. Too low – noise and tooth wear.", "oh": ["המסבים מתחממים ונשחקים", "הגלגלים יסתובבו חלק יותר והרכב ייסע שקט יותר", "השמן יהיה נקי יותר"], "oe": ["Bearings run hot and wear", "The wheels turn smoother and the car runs quieter", "The oil stays cleaner"], "id": 74}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "מה זה מבנה שמחזיק את הפיניון משני הצדדים (Straddle Mount)?", "qe": "What is a straddle-mounted pinion?", "ah": "יש מסב גם לפני השיניים וגם אחריהן. הפיניון מתכופף פחות בעומס כבד.", "ae": "A bearing both before and after the teeth. The pinion bends less under heavy load.", "oh": ["מסבים משני צידי השיניים", "פיניון בלי מסבים בכלל", "שני פיניונים זה לצד זה שמחלקים את הכוח"], "oe": ["Bearings on both sides of the teeth", "A pinion with no bearings", "Two pinions side by side sharing the load"], "id": 75}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "למה הגלגלים הקטנים בתוך הבית (Spider Gears) לא צריכים מסבים מיוחדים?", "qe": "Why do spider gears need no special bearings?", "ah": "בנסיעה ישרה הם כמעט לא מסתובבים על הציר שלהם, רק בסיבובים ובמהירות נמוכה יחסית.", "ae": "Driving straight they barely turn on their pin – only in turns, and fairly slowly.", "oh": ["כמעט לא מסתובבים בנסיעה ישרה", "הם עשויים מפלסטיק קל מאוד", "הם מקבלים שמן בלחץ ישירות ממשאבת המנוע"], "oe": ["They barely spin when driving straight", "They are made of very light plastic", "They get pressure oil directly from the engine pump"], "id": 76}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "מה נושא את משקל הרכב בציר אחורי חצי-צף (Semi-floating)?", "qe": "In a semi-floating axle, what carries the car weight?", "ah": "ציר הגלגל עצמו. הוא גם מסובב וגם נושא משקל, אז הוא צריך להיות עבה.", "ae": "The axle shaft itself. It both drives and carries weight, so it must be thick.", "oh": ["ציר הגלגל עצמו", "רק הבית של הדיפרנציאל", "רק הקפיצים של הרכב"], "oe": ["The axle shaft itself", "Only the differential case", "Only the car springs"], "id": 77}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "מה היתרון של ציר צף מלא (Full-floating) במשאיות?", "qe": "Advantage of a full-floating axle in trucks?", "ah": "המשקל עובר דרך מסבים על הבית. הציר רק מסובב, ואפשר להוציא אותו בלי להוריד את הגלגל.", "ae": "Weight goes through bearings on the housing. The shaft only drives and can be removed without taking off the wheel.", "oh": ["הציר רק מסובב ולא נושא משקל", "הוא קל יותר ולכן מוריד את צריכת הדלק", "הוא לא צריך שמן בכלל"], "oe": ["The shaft only drives, carries no weight", "It's lighter, so it cuts fuel use", "It needs no oil at all"], "id": 78}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "מה זה \"זמזום\" (Whine) שמשתנה עם המהירות?", "qe": "What is a whine that changes with speed?", "ah": "בדרך כלל מגע לא נכון בין הפיניון לכתר, או מסב פיניון שחוק.", "ae": "Usually wrong pinion-to-ring contact, or a worn pinion bearing.", "oh": ["מגע לא נכון או מסב שחוק", "רוח שנכנסת דרך החלון", "צמיג עם לחץ אוויר גבוה מדי שמזמזם על הכביש"], "oe": ["Wrong contact or a worn bearing", "Wind coming through the window", "An over-inflated tyre humming on the road"], "id": 79}, {"topic": "דיפרנציאל · מסבים ועומסים (Bearings & Loads)", "type": "mcq", "qh": "למה הבית של הדיפרנציאל עשוי ברזל יצוק או פלדה?", "qe": "Why is the diff housing cast iron or steel?", "ah": "צריך להיות קשיח מאוד, כדי שהגלגלים יישארו במקום המדויק תחת כוח גדול.", "ae": "It must be very stiff so gears stay exactly aligned under big force.", "oh": ["קשיח מאוד ושומר על יישור", "הוא הכי קל ומפזר חום טוב יותר מאלומיניום", "מבודד רעש לגמרי"], "oe": ["Very stiff and keeps alignment", "It's lightest and sheds heat better than aluminium", "Fully blocks noise"], "id": 80}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "נקישה (Clunk) כשעוברים מנסיעה לבלימה. מה הסיבה הנפוצה?", "qe": "Clunk when switching from gas to brake – common cause?", "ah": "רווח גדול מדי (Backlash) בין הפיניון לכתר, או בגלגלים הקטנים בבית.", "ae": "Too much backlash between pinion and ring, or in the spider gears.", "oh": ["רווח גדול מדי בין השיניים", "שמן ישן מדי שאיבד את הצמיגות שלו", "צמיגים חדשים מדי"], "oe": ["Too much gap between teeth", "Old oil that has lost its viscosity", "Tyres that are too new"], "id": 81}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "רעש רק בסיבובים ולא בנסיעה ישרה. מה חשוד?", "qe": "Noise only in turns, not straight – suspect?", "ah": "הגלגלים הקטנים בתוך הבית, כי הם עובדים רק כשיש הבדל מהירות.", "ae": "The spider gears, since they only work when wheel speeds differ.", "oh": ["הגלגלים הקטנים בתוך הבית", "הפיניון בכניסה לבית", "מסבי הגלגלים הקדמיים שמתחממים בנסיעה ארוכה"], "oe": ["The spider gears inside the case", "The pinion at the input", "Front wheel bearings heating on long drives"], "id": 82}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "מה זה \"סימון מגע\" (Contact Pattern) בבדיקה?", "qe": "What is a contact-pattern check?", "ah": "מורחים צבע על שיני הכתר, מסובבים, ורואים איפה השיניים נוגעות. המגע צריך להיות במרכז.", "ae": "Paint the ring teeth, turn it, and see where the teeth touch. Contact should be centred.", "oh": ["צבע שמראה איפה השיניים נוגעות", "מספר שמוטבע על גלגל הכתר ומציין את היחס", "מדבקה עם תאריך ההחלפה"], "oe": ["Paint showing where teeth touch", "A number stamped on the ring gear giving the ratio", "A sticker with the change date"], "id": 83}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "למה מחליפים פיניון וכתר תמיד כזוג?", "qe": "Why are pinion and ring always replaced as a pair?", "ah": "הם מעובדים ונבדקים יחד במפעל כדי לעבוד בשקט. זוג מעורבב יהיה רועש.", "ae": "They are finished and tested together at the factory to run quietly. A mixed pair is noisy.", "oh": ["הם מותאמים יחד במפעל", "כי הם תמיד באותו צבע", "החוק דורש את זה בכל מדינה"], "oe": ["They are matched together at the factory", "Because they are always the same colour", "The law requires it everywhere"], "id": 84}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "צמיגים בגדלים שונים מאוד על אותו ציר – מה הסכנה?", "qe": "Very different tyre sizes on one axle – danger?", "ah": "הדיפרנציאל עובד כל הזמן כאילו בסיבוב. הגלגלים הקטנים בבית מתחממים ונשחקים.", "ae": "The diff works constantly as if turning. The spider gears overheat and wear.", "oh": ["הדיפרנציאל עובד כל הזמן ומתחמם", "הרכב יהיה חסכוני יותר בדלק בנסיעה בכביש מהיר", "שום דבר, זה לא משנה"], "oe": ["The diff works constantly and overheats", "The car will be more fuel-efficient on the highway", "Nothing, it does not matter"], "id": 85}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "מה גורם לשבירת שן בגלגל הכתר בדרך כלל?", "qe": "What usually breaks a ring gear tooth?", "ah": "מכה חזקה פתאומית – למשל גלגל מסתובב בלי אחיזה ואז תופס בבת אחת.", "ae": "A sudden shock – e.g. a wheel spinning freely then gripping all at once.", "oh": ["מכה פתאומית כשגלגל תופס", "נסיעה איטית בעיר עם הרבה עצירות והתחלות", "שטיפת רכב במים"], "oe": ["A sudden shock when a wheel grips", "Slow city driving with lots of stop-and-go", "Washing the car with water"], "id": 86}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "רעידה שעולה עם מהירות הרכב (לא המנוע). מה לבדוק?", "qe": "Vibration rising with road speed (not engine) – check what?", "ah": "איזון גלגלים, גל ההינע ומפרקים, ומסבי הגלגלים.", "ae": "Wheel balance, driveshaft and joints, and wheel bearings.", "oh": ["איזון, גל הינע ומסבי גלגל", "רק את המצבר ואת חיבורי החשמל של המנוע", "רק את המזגן והמאוורר"], "oe": ["Balance, driveshaft and wheel bearings", "Only the battery and engine electrical connections", "Only the AC and fan"], "id": 87}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "דליפת שמן ליד הגלגל האחורי. מה הסיבה הסבירה?", "qe": "Oil leak near a rear wheel – likely cause?", "ah": "אטם הציר (Axle Seal) נשחק, והשמן מהדיפרנציאל זולג לאורך הציר.", "ae": "A worn axle seal lets diff oil run out along the axle.", "oh": ["אטם הציר נשחק", "הצמיג מחורר", "מיכל הדלק מלא מדי"], "oe": ["A worn axle seal", "A punctured tyre", "An overfull fuel tank"], "id": 88}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "למה נהיגה ארוכה עם גלגל רזרבי קטן (Space Saver) מזיקה?", "qe": "Why is long driving on a small spare harmful?", "ah": "הגלגל קטן ומסתובב מהר יותר, אז הדיפרנציאל עובד כל הזמן ומתחמם.", "ae": "The small wheel spins faster, so the diff works constantly and heats up.", "oh": ["הדיפרנציאל עובד כל הזמן", "הרכב הופך לכבד יותר בצד אחד ונוטה לפנות", "המנוע מסתובב לאט יותר"], "oe": ["The diff works all the time", "The car gets heavier on one side and pulls", "The engine spins slower"], "id": 89}, {"topic": "דיפרנציאל · רעשים, כשלים ואבחון (Noise, Failure & Diagnosis)", "type": "mcq", "qh": "בראיון: \"הרכב משמיע זמזום רק בתאוצה\". מה תענה?", "qe": "Interview: \"whine only under acceleration\" – answer?", "ah": "המגע בין הפיניון לכתר בצד ה\"נסיעה\" לא תקין, או Preload של המסב חלש.", "ae": "The pinion-to-ring contact on the drive side is off, or the bearing preload is low.", "oh": ["מגע בצד הנסיעה או Preload חלש", "הצמיגים מנופחים יותר מדי וזה מעביר רעש", "אין קשר לדיפרנציאל בכלל"], "oe": ["Drive-side contact or low preload", "The tyres are over-inflated and transmit noise", "It has nothing to do with the diff"], "id": 90}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "כמה דיפרנציאלים יש ברכב עם הנעה קבועה לכל הגלגלים (AWD)?", "qe": "How many differentials in a full-time AWD car?", "ah": "שלושה: קדמי, אחורי, ומרכזי בין הצירים.", "ae": "Three: front, rear, and a centre one between the axles.", "oh": ["שלושה", "אחד", "ארבעה"], "oe": ["Three", "One", "Four"], "id": 91}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "למה צריך דיפרנציאל מרכזי (Center Diff)?", "qe": "Why is a centre differential needed?", "ah": "בסיבוב הגלגלים הקדמיים עוברים מרחק קצת שונה מהאחוריים. בלי דיפרנציאל מרכזי משהו נגרר.", "ae": "In a turn the front wheels travel a bit differently from the rears. Without it, something scrubs.", "oh": ["קדמי ואחורי עוברים מרחק שונה", "כדי להוסיף כוח למנוע בנסיעה בעליות תלולות", "כדי לחסוך דלק בנסיעה ישרה"], "oe": ["Front and rear travel different distances", "To add engine power on steep climbs", "To save fuel when straight"], "id": 92}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "מה זה תיבת העברה (Transfer Case) בג׳יפ?", "qe": "What is a transfer case in a 4x4?", "ah": "מחלקת כוח בין הציר הקדמי לאחורי, ולרוב יש בה גם הילוך נמוך (Low Range).", "ae": "Splits power between front and rear axles, and often has a low range.", "oh": ["מחלקת כוח קדימה ואחורה", "מחליפה בין מנוע דלק למנוע חשמלי ברכב היברידי", "מקררת את המנוע בשטח"], "oe": ["Splits power front and rear", "Switches between fuel and electric motor in a hybrid", "Cools the engine off-road"], "id": 93}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "למה לא נוסעים ב-4x4 \"חלקי\" (Part-time) על אספלט יבש?", "qe": "Why not use part-time 4x4 on dry asphalt?", "ah": "אין בו דיפרנציאל מרכזי. בסיבובים הצירים \"נלחמים\" והמערכת נמתחת ונשחקת (Wind-up).", "ae": "It has no centre diff. In turns the axles fight and the drivetrain winds up and wears.", "oh": ["אין דיפרנציאל מרכזי והמערכת נמתחת", "ההילוכים שלו מהירים מדי לנסיעה בכביש", "הצמיגים יתנפחו מהחום"], "oe": ["No centre diff, so it winds up", "Its gearing is too fast for road driving", "The tyres will swell from heat"], "id": 94}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "מה עושה הילוך נמוך (Low Range)?", "qe": "What does low range do?", "ah": "מאט עוד פי 2 עד 3 בערך. הרכב איטי מאוד אבל חזק מאוד – לטיפוס ולירידה תלולה.", "ae": "Slows about 2 to 3 times more. Very slow but very strong – for steep climbs and descents.", "oh": ["מאט ומחזק פי 2–3 בערך", "מאיץ את הרכב פי 2 כדי לטפס מהר יותר", "מנתק את ההנעה לגמרי"], "oe": ["Slows and strengthens about 2–3×", "Speeds the car up 2x to climb faster", "Disconnects drive completely"], "id": 95}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "מה זה מצמד ויסקוזי (Viscous Coupling)?", "qe": "What is a viscous coupling?", "ah": "דסקיות בתוך נוזל סמיך. כשציר אחד מסתובב הרבה יותר מהר, הנוזל מתחמם, מתעבה ומעביר כוח.", "ae": "Discs in thick fluid. When one shaft spins much faster, the fluid heats, thickens and passes force.", "oh": ["דסקיות בנוזל שמעביר כוח בהחלקה", "מגנט קבוע שנועל את הצירים כשגלגל מחליק", "רצועה שמחברת את הצירים"], "oe": ["Discs in fluid that pass force when slipping", "A permanent magnet locking the shafts when a wheel slips", "A belt joining the shafts"], "id": 96}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "מה ההבדל בין AWD ל-4x4 \"אמיתי\" בשטח?", "qe": "AWD vs \"real\" 4x4 off-road?", "ah": "AWD נוח לכביש וגשם. 4x4 יש לו בדרך כלל הילוך נמוך ונעילות לשטח קשה.", "ae": "AWD suits roads and rain. 4x4 usually has low range and lockers for hard terrain.", "oh": ["ל-4x4 יש הילוך נמוך ונעילות", "ל-AWD יש תמיד יותר כוח ויותר נעילות בשטח", "אין שום הבדל בכלל"], "oe": ["4x4 has low range and lockers", "AWD always has more power and more lockers off-road", "There is no difference"], "id": 97}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "מה זה הנעה לפי דרישה (On-demand AWD)?", "qe": "What is on-demand AWD?", "ah": "רוב הזמן רק ציר אחד מניע. כשהוא מחליק, מצמד נסגר ושולח כוח גם לציר השני.", "ae": "Most of the time one axle drives. When it slips, a clutch closes and sends force to the other.", "oh": ["מצמד שולח כוח כשציר מחליק", "כל הגלגלים תמיד נעולים יחד", "הנהג מחליף ידנית בכל פעם"], "oe": ["A clutch sends force when an axle slips", "All wheels always locked together", "The driver switches by hand each time"], "id": 98}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "למה במכוניות חשמליות לפעמים אין דיפרנציאל מרכזי?", "qe": "Why do some EVs have no centre diff?", "ah": "יש מנוע נפרד לכל ציר, והמחשב שולט בכוח של כל אחד.", "ae": "There is a separate motor per axle, and the computer controls each one's force.", "oh": ["מנוע נפרד לכל ציר", "כי הן תמיד נוסעות ישר", "כי אין להן גלגלים אחוריים"], "oe": ["A separate motor per axle", "Because they always drive straight", "Because they have no rear wheels"], "id": 99}, {"topic": "דיפרנציאל · הנעה כפולה ו-4x4 (AWD & 4x4)", "type": "mcq", "qh": "מה זה וקטור מומנט (Torque Vectoring)?", "qe": "What is torque vectoring?", "ah": "שולחים יותר כוח לגלגל החיצוני בסיבוב כדי לעזור לרכב להסתובב.", "ae": "Sending more force to the outer wheel in a turn to help the car rotate.", "oh": ["יותר כוח לגלגל החיצוני בסיבוב", "אותו כוח בדיוק לכל גלגל, בלי קשר לסיבוב", "ניתוק המנוע בכל סיבוב"], "oe": ["More force to the outer wheel in a turn", "Exactly equal power to each wheel regardless of cornering", "Cutting the engine in every turn"], "id": 100}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "למה אפשר להפסיק לדווש באופניים והגלגל ממשיך להסתובב?", "qe": "Why can you stop pedalling while the bike wheel keeps turning?", "ah": "בגלגל האחורי יש מנגנון גלגל חופשי (Freewheel) – ראצ׳ט עם לשוניות שנותן לגלגל לעקוף את הדוושות.", "ae": "The rear hub has a freewheel – a ratchet with pawls that lets the wheel overrun the pedals.", "oh": ["ראצ׳ט בגלגל האחורי", "השרשרת נקרעת לרגע", "הבלם משחרר את הגלגל"], "oe": ["A ratchet in the rear hub", "The chain briefly comes off", "The brake releases the wheel"], "id": 101}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "מה הרעש \"טיק-טיק-טיק\" כשאופניים נוסעים בלי דיווש?", "qe": "What is the tick-tick sound when coasting a bike?", "ah": "הלשוניות קופצות מעל השיניים של הראצ׳ט בגלגל האחורי.", "ae": "The pawls clicking over the ratchet teeth in the rear hub.", "oh": ["לשוניות קופצות על שיניים", "השרשרת משתפשפת במסגרת כשאין עליה מתח", "אוויר יוצא מהצמיג"], "oe": ["Pawls clicking over teeth", "The chain rubs the frame when it has no tension", "Air leaking from the tyre"], "id": 102}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "מה זה מצמד גלילים חד-כיווני (Roller Clutch)?", "qe": "What is a roller one-way clutch?", "ah": "גלילים קטנים בתוך חריצים משופעים. בכיוון אחד הם נתקעים ונועלים, בשני מתגלגלים חופשי.", "ae": "Small rollers in sloped pockets. One way they wedge and lock, the other they roll free.", "oh": ["גלילים שנתקעים בכיוון אחד", "שני גלגלי שיניים שמחליפים כיוון", "קפיץ ענק שנמתח בסיבוב"], "oe": ["Rollers that wedge one way", "Two gears that swap direction", "A huge spring wound by turning"], "id": 103}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "מה היתרון של מצמד גלילים על פני ראצ׳ט עם לשונית?", "qe": "Advantage of a roller clutch over a pawl ratchet?", "ah": "נועל מיד בכל זווית, בלי \"קפיצה\" לשן הבאה, ובשקט.", "ae": "It locks instantly at any angle, with no jump to the next tooth, and silently.", "oh": ["נועל מיד בכל זווית ובשקט", "זול יותר בכל מקרה ובכל גודל", "עובד גם בשני הכיוונים יחד"], "oe": ["Locks instantly at any angle, quietly", "Always cheaper at any size", "Works both ways at once"], "id": 104}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "מה זה מצמד ספראג (Sprag Clutch)?", "qe": "What is a sprag clutch?", "ah": "חלקים קטנים מעוצבים (Sprags) שמתהפכים ונתקעים בין שתי טבעות בכיוון אחד.", "ae": "Small shaped pieces (sprags) that tilt and jam between two rings in one direction.", "oh": ["חלקים שמתהפכים ונתקעים בין טבעות", "סוג של בורג שננעל בדבק כשמהדקים אותו", "מצמד חשמלי עם סליל נחושת"], "oe": ["Pieces that tilt and jam between rings", "A bolt type that locks with adhesive when tightened", "An electric clutch with a copper coil"], "id": 105}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "איפה יש מצמד חד-כיווני במנוע רכב?", "qe": "Where is a one-way clutch in a car engine?", "ah": "במתנע (Starter): הוא מסובב את המנוע, וכשהמנוע מתניע ומסתובב מהר – המצמד משתחרר כדי לא לסובב את המתנע.", "ae": "In the starter: it cranks the engine, and once the engine runs faster it lets go so the starter is not spun.", "oh": ["במתנע, כדי שהמנוע לא יסובב אותו", "בהגה, כדי שלא יסתובב לבד כשהרכב בנסיעה", "בדלת, כדי שלא תיפתח"], "oe": ["In the starter, so the engine does not spin it", "In the steering, so it can't turn by itself while driving", "In the door, so it does not open"], "id": 106}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "איפה עוד משתמשים בראצ׳ט בחיים?", "qe": "Where else are ratchets used?", "ah": "רצועת קשירה (Ratchet Strap), מנוף ידני, אזיקון, וגלגל של חגורת בטיחות.", "ae": "Ratchet straps, hand winches, cable ties, and seat-belt reels.", "oh": ["רצועת קשירה, אזיקון, חגורת בטיחות", "רק במפתחות של מכונאים ובכלים מקצועיים", "רק במכוניות מירוץ"], "oe": ["Ratchet straps, cable ties, seat belts", "Only in mechanics' wrenches and pro tools", "Only in race cars"], "id": 107}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "איך אזיקון (Cable Tie) הוא ראצ׳ט?", "qe": "How is a cable tie a ratchet?", "ah": "יש לו שיניים לאורך, ולשונית קטנה בראש שנותנת להדק אבל לא לשחרר.", "ae": "It has teeth along it and a small pawl in the head that lets it tighten but not loosen.", "oh": ["שיניים ולשונית שנותנת רק להדק", "דבק שמתייבש כמה שניות אחרי שסוגרים אותו", "מגנט קטן שמחזיק את הקצה"], "oe": ["Teeth and a pawl that only let it tighten", "Glue that sets a few seconds after closing it", "A small magnet holding the end"], "id": 108}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "מה הסכנה אם ראצ׳ט של מנוף נשבר תחת משקל?", "qe": "Danger if a winch ratchet fails under load?", "ah": "המשקל נופל והידית יכולה להסתובב אחורה בכוח. לכן יש גם בלם נוסף.", "ae": "The load drops and the handle can spin back violently. So a second brake is added.", "oh": ["המשקל נופל והידית מסתובבת בכוח", "המנוף פשוט נעצר במקום והמשקל נשאר תלוי", "שום סכנה, הכבל יחזיק"], "oe": ["The load drops and the handle spins back", "The hoist simply stops and the load stays hanging", "No danger, the cable holds"], "id": 109}, {"topic": "ראצ׳ט · גלגל חופשי וחד-כיווני (Freewheel & One-Way Clutch)", "type": "mcq", "qh": "כמה לשוניות יש בדרך כלל בגלגל אופניים איכותי ולמה?", "qe": "How many pawls in a quality bike hub, and why?", "ah": "לרוב 3 עד 6. יותר לשוניות מחלקות את הכוח וגם תופסות מהר יותר.", "ae": "Often 3 to 6. More pawls share the force and engage sooner.", "oh": ["3–6, לחלק את הכוח", "אחת, כדי לחסוך משקל", "מאה, כדי שיהיה שקט"], "oe": ["3–6, to share the load", "One, to save weight", "A hundred, for silence"], "id": 110}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "מה תפקיד הקפיץ שלוחץ על הלשונית?", "qe": "What does the spring on the pawl do?", "ah": "דוחף את הלשונית תמיד אל השיניים, כדי שתתפוס מיד כשמסובבים אחורה.", "ae": "Keeps pushing the pawl into the teeth so it catches at once when turned backward.", "oh": ["דוחף את הלשונית אל השיניים", "מסובב את הגלגל קדימה לבד אחרי כל לחיצה", "מוריד את הרעש של הראצ׳ט"], "oe": ["Pushes the pawl into the teeth", "Turns the wheel forward by itself after each push", "Lowers the ratchet noise"], "id": 111}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "קפיץ שנלחץ 2 מ\"מ ב-10 ניוטון. כמה ניוטון ב-4 מ\"מ?", "qe": "A spring compresses 2 mm at 10 N. Force at 4 mm?", "ah": "קפיץ רגיל: פי 2 לחיצה – פי 2 כוח. 20 ניוטון.", "ae": "A normal spring: twice the squeeze, twice the force. 20 N.", "oh": ["20 ניוטון", "40 ניוטון", "10 ניוטון"], "oe": ["20 N", "40 N", "10 N"], "id": 112}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "מה זה קשיחות קפיץ (Spring Rate)?", "qe": "What is spring rate?", "ah": "כמה כוח צריך כדי ללחוץ אותו מ\"מ אחד. קפיץ קשיח – צריך יותר כוח.", "ae": "How much force it takes to compress it 1 mm. A stiff spring needs more.", "oh": ["כמה כוח ללחוץ מ\"מ אחד", "כמה פעמים הקפיץ מסתובב", "מה האורך המלא של הקפיץ"], "oe": ["Force to compress 1 mm", "How many coils it has", "Its full length"], "id": 113}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "מה קורה לקפיץ שנלחץ יותר מדי (מעבר לגבול)?", "qe": "What happens to a spring squeezed past its limit?", "ah": "הוא מתעוות לצמיתות ולא חוזר לאורך שלו. אומרים שהוא \"התיישב\" (Set).", "ae": "It permanently deforms and does not return to length – it \"takes a set\".", "oh": ["מתעוות ולא חוזר לאורך", "נעשה קשיח יותר לתמיד ודוחף חזק יותר", "שום דבר, תמיד חוזר"], "oe": ["Deforms and does not return", "Becomes permanently stiffer and pushes harder", "Nothing, it always returns"], "id": 114}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "במצמד מומנט, מה משנה הסיבוב של הטבעת עם המספרים?", "qe": "In a torque clutch, what does turning the numbered ring change?", "ah": "כמה הקפיץ לחוץ. יותר לחיצה – צריך יותר כוח כדי שהכדורים יקפצו.", "ae": "How much the spring is squeezed. More squeeze – more force before the balls jump.", "oh": ["כמה הקפיץ לחוץ", "את מהירות המנוע", "את כיוון הסיבוב"], "oe": ["How much the spring is squeezed", "The motor speed", "The turning direction"], "id": 115}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "ממה עשויים קפיצים חזקים בדרך כלל?", "qe": "What are strong springs usually made of?", "ah": "פלדת קפיצים (Spring Steel) – פלדה שמוקשחת כך שתתכופף הרבה ותחזור.", "ae": "Spring steel – steel heat-treated to bend a lot and come back.", "oh": ["פלדת קפיצים", "אלומיניום רך", "נחושת טהורה"], "oe": ["Spring steel", "Soft aluminium", "Pure copper"], "id": 116}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "למה קפיץ יכול להישבר אחרי מיליון לחיצות?", "qe": "Why can a spring break after a million cycles?", "ah": "עייפות (Fatigue): סדק זעיר גדל בכל לחיצה עד שהקפיץ נשבר.", "ae": "Fatigue: a tiny crack grows with each cycle until it snaps.", "oh": ["עייפות – סדק שגדל בכל לחיצה", "הוא נמס בהדרגה מהחום של הידיים והחיכוך", "הוא מתכווץ מקור בלילה"], "oe": ["Fatigue – a crack grows each cycle", "It gradually melts from hand heat and friction", "It shrinks from cold at night"], "id": 117}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "מה זה קפיץ פיתול (Torsion Spring)?", "qe": "What is a torsion spring?", "ah": "קפיץ שעובד בסיבוב, לא בלחיצה. למשל בקפיץ של אטב כביסה.", "ae": "A spring that works by twisting, not squeezing – like in a clothes peg.", "oh": ["קפיץ שעובד בסיבוב", "קפיץ שעובד רק במתיחה", "קפיץ עשוי מגומי"], "oe": ["A spring that works by twisting", "A spring working only in tension", "A spring made of rubber"], "id": 118}, {"topic": "ראצ׳ט · קפיצים (Springs)", "type": "mcq", "qh": "למה לא שמים קפיץ חזק מאוד על הלשונית?", "qe": "Why not use a very strong pawl spring?", "ah": "הלשונית תשתפשף חזק על השיניים בכל סיבוב קדימה – יותר שחיקה ויותר כוח מהיד.", "ae": "The pawl would rub hard over the teeth on every forward turn – more wear and more hand effort.", "oh": ["שחיקה ומאמץ גדולים בסיבוב קדימה orce to break vs scratch resistance", "Two words for exactly the same", "Strength for plastic, hardness for metal"], "id": 130}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "מה עושה מפתח מומנט (Torque Wrench) עם קליק?", "qe": "What does a click torque wrench do?", "ah": "כשמגיעים לכוח שנבחר, מנגנון קפיץ \"קופץ\" ומשמיע קליק. ככה יודעים לעצור.", "ae": "At the set force a spring mechanism trips and clicks, so you know to stop.", "oh": ["מקליק כשמגיעים לכוח שנבחר", "מסובב את הבורג לבד עד שמגיע למומנט", "מונע סיבוב לאחור בלבד"], "oe": ["Clicks at the set force", "Turns the bolt by itself until reaching torque", "Only prevents backward turning"], "id": 131}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "למה חשוב להדק ברגי גלגל במומנט הנכון?", "qe": "Why tighten wheel nuts to the right torque?", "ah": "חלש מדי – הגלגל יכול להשתחרר. חזק מדי – הבורג נמתח, ודיסק הבלם יכול להתעקם.", "ae": "Too loose – the wheel can come off. Too tight – the stud stretches and the brake disc can warp.", "oh": ["חלש משתחרר, חזק מדי מזיק", "כדי שיהיה קל לפתוח אחר כך", "רק בגלל דרישה של היצרן"], "oe": ["Too loose comes off, too tight damages", "So it is easy to open later", "Only because the maker says so"], "id": 132}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "מומנט 100 Nm, ידית באורך 0.5 מטר. כמה כוח ביד?", "qe": "100 Nm on a 0.5 m handle – how much hand force?", "ah": "100 חלקי 0.5 = 200 ניוטון (בערך 20 ק\"ג).", "ae": "100 divided by 0.5 = 200 N (about 20 kg).", "oh": ["200 ניוטון", "50 ניוטון", "100 ניוטון"], "oe": ["200 N", "50 N", "100 N"], "id": 133}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "למה מחזירים מפתח מומנט עם קליק ל\"אפס\" אחרי שימוש?", "qe": "Why set a click torque wrench back to zero after use?", "ah": "כדי שהקפיץ לא יישאר לחוץ שבועות ויאבד כוח – אחרת המדידה תהיה שגויה.", "ae": "So the spring is not left squeezed for weeks and lose force – otherwise readings drift.", "oh": ["כדי שהקפיץ לא יאבד כוח", "כדי שהמנגנון לא יסתובב בארגז הכלים", "כדי לחסוך בסוללה"], "oe": ["So the spring does not weaken", "So the mechanism doesn't turn in the toolbox", "To save the battery"], "id": 134}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "למה לא משתמשים במפתח מומנט כדי לפתוח בורג תקוע?", "qe": "Why not use a torque wrench to break loose a stuck bolt?", "ah": "הכוח הגדול יכול לפגוע במנגנון המדידה ולהרוס את הדיוק.", "ae": "The big force can damage the measuring mechanism and ruin accuracy.", "oh": ["זה הורס את הדיוק שלו", "הוא לא מסתובב לכיוון הזה", "הוא קצר מדי לזה"], "oe": ["It ruins its accuracy", "It cannot turn that way", "It is too short for that"], "id": 135}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "כמה פעמים כדאי לכייל מפתח מומנט?", "qe": "How often should a torque wrench be calibrated?", "ah": "בערך פעם בשנה או אחרי 5,000 שימושים, ומיד אם הוא נפל.", "ae": "About once a year or after about 5,000 uses, and right away if dropped.", "oh": ["פעם בשנה או אחרי נפילה", "אף פעם, הוא תמיד מדויק", "בכל פעם לפני בורג"], "oe": ["Yearly or after a drop", "Never, it is always accurate", "Before every single bolt"], "id": 136}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "מה ההבדל בין מפתח מומנט קליק לדיגיטלי?", "qe": "Click vs digital torque wrench?", "ah": "קליק – קפיץ ומנגנון. דיגיטלי – חיישן שמראה מספר על מסך, לפעמים גם זווית.", "ae": "Click – spring mechanism. Digital – a sensor showing a number, sometimes the angle too.", "oh": ["קפיץ מול חיישן עם מסך", "דיגיטלי עובד רק בשמאל", "אין שום הבדל בכלל"], "oe": ["Spring vs sensor with a screen", "Digital only works left-hand", "No difference at all"], "id": 137}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "מה זה הידוק בזווית (Torque-to-Angle)?", "qe": "What is torque-to-angle tightening?", "ah": "מהדקים למומנט קטן, ואז מסובבים עוד זווית קבועה, למשל 90 מעלות. מדויק יותר במתיחת הבורג.", "ae": "Tighten to a small torque, then turn a set extra angle, e.g. 90°. It controls bolt stretch better.", "oh": ["מומנט קטן ועוד זווית קבועה", "מהדקים עד שהבורג מתחיל להימתח ונשבר", "מהדקים ביד בלי כלי"], "oe": ["Small torque then a set angle", "Tighten until the bolt starts to stretch and snap", "Hand-tight with no tool"], "id": 138}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "למה שמן על התבריג משנה את המומנט הנכון?", "qe": "Why does oil on the threads change the right torque?", "ah": "פחות חיכוך – אותו מומנט מותח את הבורג הרבה יותר. אפשר למתוח יותר מדי.", "ae": "Less friction – the same torque stretches the bolt much more. You can over-stretch it.", "oh": ["פחות חיכוך – הבורג נמתח יותר", "השמן מחליש את הפלדה של הבורג עם הזמן", "אין לזה שום השפעה"], "oe": ["Less friction – more bolt stretch", "Oil weakens the bolt steel over time", "It has no effect"], "id": 139}, {"topic": "ראצ׳ט · מפתח מומנט ומדידה (Torque Wrench & Measuring)", "type": "mcq", "qh": "מה בעצם \"מחזיק\" חיבור בורג?", "qe": "What actually holds a bolted joint?", "ah": "הבורג נמתח קצת כמו קפיץ ולוחץ את החלקים יחד. המומנט הוא רק דרך למדוד את זה.", "ae": "The bolt stretches a little like a spring and clamps the parts. Torque is just a way to estimate that.", "oh": ["מתיחת הבורג שלוחצת את החלקים", "רק החיכוך של הראש על המשטח העליון", "דבק שנמצא בתוך התבריג"], "oe": ["Bolt stretch clamping the parts", "Only the head's friction on the top surface", "Glue in the threads"], "id": 140}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "ראצ׳ט שמחליק אחורה מדי פעם. מה כנראה הבעיה?", "qe": "A ratchet that occasionally slips back – likely problem?", "ah": "לשונית שחוקה, קפיץ חלש, או לכלוך שמונע מהלשונית להיכנס עד הסוף.", "ae": "A worn pawl, weak spring, or dirt stopping the pawl seating fully.", "oh": ["לשונית שחוקה, קפיץ חלש או לכלוך", "ידית ארוכה מדי שמעמיסה יותר מדי על השיניים", "בורג קטן מדי"], "oe": ["Worn pawl, weak spring or dirt", "A handle so long it overloads the teeth", "A bolt that is too small"], "id": 141}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "למה אסור להאריך ידית ראצ׳ט עם צינור?", "qe": "Why not extend a ratchet handle with a pipe?", "ah": "המומנט גדל פי כמה והלשונית או השיניים יכולים להישבר. הידית תטוס והיד תיפגע.", "ae": "Torque multiplies and the pawl or teeth can break. The handle flies and hurts your hand.", "oh": ["השיניים עלולות להישבר ולפגוע", "הצינור יעשה את המפתח קל מדי לשליטה", "זה מותר תמיד בלי בעיה"], "oe": ["Teeth may break and cause injury", "The pipe makes the wrench too light to control", "Always fine, no problem"], "id": 142}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "מה כדאי להשתמש בו לברגים תקועים במקום ראצ׳ט?", "qe": "What to use on stuck bolts instead of a ratchet?", "ah": "ידית שבירה (Breaker Bar) בלי מנגנון ראצ׳ט – חזקה יותר כי אין לשונית שיכולה להישבר.", "ae": "A breaker bar with no ratchet mechanism – stronger, as there is no pawl to break.", "oh": ["ידית שבירה בלי לשונית", "מברג קטן עם ידית פלסטיק רחבה", "פטיש על הראצ׳ט"], "oe": ["A breaker bar with no pawl", "A small screwdriver with a wide plastic handle", "Hammer on the ratchet"], "id": 143}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "מצמד של מברגה שלא מחליק בכלל, גם במספר נמוך. מה הסכנה?", "qe": "Drill clutch never slips, even on low. Danger?", "ah": "הבורג יכול להיכנס עמוק מדי או להישבר, והמברגה יכולה לסובב את היד.", "ae": "The screw can sink too deep or snap, and the drill can twist your wrist.", "oh": ["בורג שבור ויד שמסתובבת", "הסוללה תתרוקן מהר מדי ותתחמם בטעינה", "אין סכנה בכלל"], "oe": ["Snapped screw and twisted wrist", "The battery drains too fast and heats when charging", "No danger at all"], "id": 144}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "למה במנופים יש גם ראצ׳ט וגם בלם?", "qe": "Why do winches have both a ratchet and a brake?", "ah": "כפילות (Redundancy): אם חלק אחד נכשל, השני מחזיק את המשקל.", "ae": "Redundancy: if one fails, the other still holds the load.", "oh": ["אם אחד נכשל השני מחזיק", "כדי שההרמה תהיה מהירה יותר בעומס כבד", "כדי שיהיה שקט יותר"], "oe": ["If one fails the other holds", "To lift faster under heavy load", "To make it quieter"], "id": 145}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "מה זה כשל בטוח (Fail-safe)?", "qe": "What is fail-safe design?", "ah": "כשמשהו נשבר, המערכת עוברת למצב בטוח. למשל בלם שנסגר כשאין חשמל.", "ae": "When something breaks, the system goes to a safe state – e.g. a brake that closes on power loss.", "oh": ["כשל מוביל למצב בטוח", "מוצר שאף פעם לא נשבר", "ביטוח שמכסה תקלות"], "oe": ["Failure leads to a safe state", "A product that never breaks", "Insurance that covers faults"], "id": 146}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "למה חגורת בטיחות ננעלת רק במשיכה חזקה ולא איטית?", "qe": "Why does a seat belt lock only on a sharp pull?", "ah": "משקולת או גלגל קטן \"נזרק\" החוצה במשיכה מהירה ותופס את הראצ׳ט. משיכה איטית לא מפעילה אותו.", "ae": "A small weight or wheel flies out on a fast pull and catches the ratchet. A slow pull does not trigger it.", "oh": ["משיכה מהירה מפעילה תפס", "החגורה נעולה תמיד ונפתחת רק בלחיצה", "חיישן חשמלי בלבד"], "oe": ["A fast pull triggers a catch", "The belt is always locked, released only by a button", "Only an electric sensor"], "id": 147}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "המברגה מחליקה מוקדם מדי גם במספר גבוה. מה לבדוק?", "qe": "Drill slips too early even on a high setting. Check what?", "ah": "קפיץ המצמד חלש או גומות שחוקות. אפשר גם שהמצב הוא \"מקדחה\" לא מוגדר נכון.", "ae": "A weak clutch spring or worn dimples. Also check the setting is not mis-set.", "oh": ["קפיץ חלש או גומות שחוקות", "ידית ארוכה מדי או מקדח חדש מדי", "מקדח חדש מדי"], "oe": ["Weak spring or worn dimples", "Handle too long or drill bit too new", "Bit too new"], "id": 148}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "למה משקפי מגן כשמשחררים קפיץ חזק?", "qe": "Why safety glasses when releasing a strong spring?", "ah": "קפיץ לחוץ אוגר אנרגיה. אם הוא בורח, הוא או חלקים קטנים יכולים לעוף לעיניים.", "ae": "A compressed spring stores energy. If it escapes, it or small parts can fly into the eyes.", "oh": ["קפיץ אוגר אנרגיה ויכול לעוף", "האור בסדנה חזק מדי ומסנוור את העיניים", "זה רק נוהל של חברות"], "oe": ["Springs store energy and can fly", "The workshop light is too bright and dazzling", "Just a company rule"], "id": 149}, {"topic": "ראצ׳ט · כשלים ובטיחות (Failures & Safety)", "type": "mcq", "qh": "בראיון: \"איך תתכנן ראצ׳ט שלא ייכשל?\" – מה תגיד?", "qe": "Interview: \"How would you design a ratchet not to fail?\"", "ah": "פלדה מוקשחת, כמה לשוניות שחולקות כוח, מקדם ביטחון, ובדיקות חיים עם עומס יתר.", "ae": "Hardened steel, several pawls sharing load, a safety factor, and life tests with overload.", "oh": ["מוקשחת, כמה לשוניות ובדיקות", "רק לבחור צבע בולט", "להקטין אותו כמה שאפשר ולחסוך במשקל"], "oe": ["Hardened, multiple pawls and testing", "Just pick a bright colour", "Make it as small as possible to save weight"], "id": 150}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "מה זה מפרק הומוקינטי (CV Joint – Constant Velocity)?", "qe": "What is a CV joint?", "ah": "מפרק שמעביר סיבוב בזווית במהירות אחידה לגמרי – בלי ההאצה וההאטה של קרדן.", "ae": "A joint that passes rotation at an angle at perfectly even speed – no speed-up and slow-down like a U-joint.", "oh": ["מעביר סיבוב בזווית במהירות אחידה", "מפרק קרדן רגיל עם צלב גדול וחזק יותר", "מפרק שעובד רק בקו ישר"], "oe": ["Passes rotation at an angle at even speed", "A normal U-joint with a bigger, stronger cross", "A joint that only works straight"], "id": 151}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "איפה יש מפרקים הומוקינטיים ברכב עם הנעה קדמית?", "qe": "Where are CV joints in a front-wheel-drive car?", "ah": "בשני הקצוות של כל גל הנעה קדמי – ליד תיבת ההילוכים וליד הגלגל.", "ae": "At both ends of each front driveshaft – by the gearbox and by the wheel.", "oh": ["בשני קצוות של כל גל קדמי", "רק בתוך עמוד ההגה מתחת ללוח המחוונים", "רק בגל האחורי הארוך"], "oe": ["At both ends of each front shaft", "Only inside the steering column under the dash", "Only on the long rear shaft"], "id": 152}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "למה בגלגל קדמי מניע לא מספיק קרדן רגיל?", "qe": "Why is a plain U-joint not enough at a driven front wheel?", "ah": "הגלגל מסתובב בהגה בזווית גדולה, עד 45 מעלות. קרדן בזווית כזאת רועד מאוד.", "ae": "The wheel steers at big angles, up to about 45°. A U-joint at that angle shakes badly.", "oh": ["זווית ההגה גדולה מדי לקרדן", "קרדן כבד מדי ולא נכנס ברכב קטן", "קרדן לא יכול להסתובב מהר"], "oe": ["Steering angle is too big for a U-joint", "A U-joint is too heavy to fit a small car", "A U-joint cannot spin fast"], "id": 153}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "מה זה מפרק רצפה (Rzeppa)?", "qe": "What is a Rzeppa joint?", "ah": "מפרק הומוקינטי עם 6 כדורים בתוך מסלולים, שמחזיקים את שני הצדדים באותה זווית.", "ae": "A CV joint with 6 balls in grooves that keep both halves at matching angles.", "oh": ["מפרק עם 6 כדורים במסלולים", "מפרק עם צלב וארבעה מסבי מחטים", "מפרק גומי פשוט"], "oe": ["A joint with 6 balls in grooves", "A joint with a cross and four needle bearings", "A simple rubber joint"], "id": 154}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "מה זה מפרק טריפוד (Tripod Joint)?", "qe": "What is a tripod joint?", "ah": "מפרק עם 3 גלילים על זרועות שנעים בתוך תעלות. מאפשר גם לגל להתארך ולהתקצר.", "ae": "A joint with 3 rollers on arms sliding in channels. It also lets the shaft lengthen and shorten.", "oh": ["3 גלילים שנעים בתעלות
