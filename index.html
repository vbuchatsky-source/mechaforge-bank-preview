", "שני גלגלי שיניים קוניים", "קפיץ גדול בתוך צינור"], "oe": ["3 rollers sliding in channels", "Two bevel gears", "A big spring inside a tube"], "id": 155}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "למה גל ההנעה הקדמי צריך להתארך ולהתקצר?", "qe": "Why must the front driveshaft change length?", "ah": "כשהמתלה עולה ויורד, המרחק בין תיבת ההילוכים לגלגל משתנה קצת.", "ae": "As the suspension moves up and down, the gearbox-to-wheel distance changes a little.", "oh": ["המתלה משנה את המרחק", "הגל מתחמם ומתארך הרבה", "הנהג מכוון אותו בנסיעה"], "oe": ["Suspension changes the distance", "The shaft heats and grows a lot", "The driver adjusts it while driving"], "id": 156}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "מה הסימן הקלאסי למפרק הומוקינטי חיצוני שחוק?", "qe": "Classic sign of a worn outer CV joint?", "ah": "טקטוק מהיר כשמסובבים הגה עד הסוף ונוסעים לאט, למשל בחניה.", "ae": "Fast clicking when turning at full lock at low speed, e.g. parking.", "oh": ["טקטוק בסיבוב חד ואיטי", "רעש רק בנסיעה ישרה מהירה", "ריח של דלק ליד הגלגל"], "oe": ["Clicking in slow, tight turns", "Noise only straight at speed", "Fuel smell near the wheel"], "id": 157}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "מה תפקיד כיסוי הגומי (CV Boot)?", "qe": "What does the rubber CV boot do?", "ah": "שומר את הגריז בפנים ואבק ומים בחוץ. כיסוי קרוע = המפרק נהרס בקרוב.", "ae": "Keeps grease in and dust and water out. A torn boot means the joint will soon fail.", "oh": ["שומר גריז בפנים ולכלוך בחוץ", "מחזיק את המפרק שלא יזוז מהמקום בנסיעה", "מבודד את הרעש מהמנוע"], "oe": ["Keeps grease in and dirt out", "Holds the joint so it can't move while driving", "Blocks engine noise"], "id": 158}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "למה הכיסוי בצורת אקורדיון?", "qe": "Why is the boot shaped like an accordion?", "ah": "כדי להתכופף ולהימתח עם הזווית והאורך של הגל בלי להיקרע.", "ae": "So it can bend and stretch with the shaft angle and length without tearing.", "oh": ["להתכופף ולהימתח בלי להיקרע", "כדי להחזיק יותר גריז ולשמן לאורך זמן", "כדי להחזיק יותר גריז"], "oe": ["To bend and stretch without tearing", "To hold more grease and lubricate longer", "To hold more grease"], "id": 159}, {"topic": "קרדן · מפרק הומוקינטי (CV Joint)", "type": "mcq", "qh": "למה במכוניות רבות עם הנעה אחורית עדיין יש קרדן?", "qe": "Why do many rear-drive cars still use U-joints?", "ah": "בגל הארוך הזוויות קטנות (פחות מ-3 מעלות), אז קרדן זול וחזק מספיק.", "ae": "On the long shaft the angles are small (under about 3°), so a cheap, strong U-joint is enough.", "oh": ["זוויות קטנות – קרדן מספיק", "הומוקינטי לא מסתובב אחורה", "החוק מחייב קרדן באחור"], "oe": ["Small angles – a U-joint is enough", "CV joints cannot turn backwards", "The law requires U-joints at the rear"], "id": 160}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "למה גל ההינע (Driveshaft) הוא צינור חלול ולא מוט מלא?", "qe": "Why is a driveshaft a hollow tube, not a solid bar?", "ah": "צינור חלול כמעט חזק כמו מוט מלא בפיתול, אבל קל בהרבה.", "ae": "A hollow tube is nearly as strong in twisting as a solid bar, but much lighter.", "oh": ["כמעט חזק כמו מלא וקל בהרבה", "כי קל יותר לצבוע אותו", "כדי שיוכל לעבור שמן בפנים ולשמן את המסבים"], "oe": ["Nearly as strong and much lighter", "Because it is easier to paint", "So oil can flow inside to lube the bearings"], "id": 161}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "מה זה איזון (Balancing) של גל הינע?", "qe": "What is driveshaft balancing?", "ah": "מוסיפים משקולות קטנות כדי שהמשקל יהיה שווה סביב הציר, ולא תהיה רעידה.", "ae": "Small weights are added so mass is even around the axis, with no vibration.", "oh": ["משקולות שמשווים את המשקל", "בדיקה שהגל ישר לגמרי לכל אורכו", "הוספת שמן לגל"], "oe": ["Weights that even out the mass", "Checking the shaft is perfectly straight", "Adding oil to the shaft"], "id": 162}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "מה זה מהירות קריטית (Critical Speed) של גל?", "qe": "What is the critical speed of a shaft?", "ah": "מהירות שבה הגל מתחיל \"לקפוץ\" ולהתכופף כמו חבל קפיצה. חייבים להישאר רחוק ממנה.", "ae": "A speed where the shaft starts to whirl and bow like a skipping rope. You must stay well away from it.", "oh": ["מהירות שבה הגל מתכופף ורועד", "המהירות המרבית של המנוע", "המהירות שבה השמן בתוך הגל מתחיל לרתוח"], "oe": ["Speed where the shaft bows and whirls", "The engine's top speed", "The speed at which oil in the shaft boils"], "id": 163}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "למה גל ארוך מאוד מחולק לשניים עם מסב באמצע?", "qe": "Why split a very long shaft in two with a centre bearing?", "ah": "גל ארוך ודק מגיע למהירות קריטית מוקדם. שני גלים קצרים בטוחים יותר.", "ae": "A long, thin shaft hits critical speed early. Two short shafts are safer.", "oh": ["גל ארוך מגיע למהירות קריטית", "כדי שיהיה קל יותר לייצר ולצבוע אותו", "כדי להוסיף עוד כוח"], "oe": ["A long shaft hits critical speed", "So it's easier to make and paint", "To add more power"], "id": 164}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "למה יש גלי הינע מסיבי פחמן (Carbon Fibre)?", "qe": "Why are there carbon-fibre driveshafts?", "ah": "קלים וקשיחים מאוד, אז אפשר גל אחד ארוך בלי מסב אמצעי.", "ae": "Very light and stiff, so one long shaft works without a centre bearing.", "oh": ["קלים וקשיחים – גל אחד ארוך", "זולים יותר מפלדה ונוחים יותר לתיקון", "מעבירים חשמל טוב"], "oe": ["Light and stiff – one long shaft", "Cheaper than steel and easier to repair", "They conduct electricity well"], "id": 165}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "מה תפקיד החלק המשונן המחליק (Slip Yoke) בגל ההינע?", "qe": "What does the splined slip yoke do?", "ah": "מאפשר לגל להתארך ולהתקצר כשהציר האחורי קופץ על הקפיצים.", "ae": "Lets the shaft lengthen and shorten as the rear axle moves on its springs.", "oh": ["מאפשר שינוי אורך", "נועל את הגל במקום", "מקרר את תיבת ההילוכים"], "oe": ["Allows length change", "Locks the shaft in place", "Cools the gearbox"], "id": 166}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "מה קורה אם משקולת איזון נופלת מהגל?", "qe": "What if a balance weight falls off the shaft?", "ah": "רעידה שמורגשת ברצפה, ובעיקר במהירות גבוהה.", "ae": "Vibration felt through the floor, mostly at high speed.", "oh": ["רעידה ברצפה במהירות גבוהה", "הרכב לא יזוז בכלל עד שמחזירים אותה", "רעש רק בסיבובים"], "oe": ["Floor vibration at high speed", "The car won't move at all until it's refitted", "Noise only in turns"], "id": 167}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "למה מסמנים את הגל לפני שמפרקים אותו מהרכב?", "qe": "Why mark the shaft before removing it?", "ah": "כדי להחזיר אותו באותו מיקום בדיוק – שהאיזון והיישור של המפרקים יישמרו.", "ae": "To refit it in exactly the same position so balance and joint phasing are kept.", "oh": ["לשמור על איזון ויישור", "כדי לדעת מאיזה רכב הוא", "זה דרישה של המשטרה"], "oe": ["To keep balance and phasing", "To know which car it came from", "The police require it"], "id": 168}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "גל מסתובב 3,000 סל\"ד. כמה סיבובים בשנייה?", "qe": "A shaft at 3,000 rpm – turns per second?", "ah": "3,000 חלקי 60 = 50 סיבובים בשנייה.", "ae": "3,000 divided by 60 = 50 per second.", "oh": ["50", "300", "5"], "oe": ["50", "300", "5"], "id": 169}, {"topic": "קרדן · גלי הינע ואיזון (Driveshafts & Balance)", "type": "mcq", "qh": "מה זה מסב תלוי (Center Support Bearing)?", "qe": "What is a centre support bearing?", "ah": "מסב בגומי שמחובר לרצפת הרכב ומחזיק את אמצע גל ארוך.", "ae": "A rubber-mounted bearing bolted to the car floor that holds the middle of a long shaft.", "oh": ["מסב בגומי שמחזיק את אמצע הגל", "מסב בתוך הגלגל הקדמי שתומך בגל", "מסב בתוך המנוע"], "oe": ["A rubber-mounted bearing at mid-shaft", "A bearing inside the front wheel supporting the shaft", "A bearing inside the engine"], "id": 170}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "איזה מסבים יש בתוך הכוסות של הקרדן?", "qe": "What bearings are inside the U-joint caps?", "ah": "מסבי מחטים (Needle Bearings) – גלילים דקים וארוכים שתופסים מעט מקום ונושאים הרבה.", "ae": "Needle bearings – long thin rollers that take little space and carry a lot.", "oh": ["מסבי מחטים", "מסבי כדורים גדולים", "תותבי פלסטיק"], "oe": ["Needle bearings", "Big ball bearings", "Plastic bushings"], "id": 171}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "למה מסבי המחטים בקרדן נשחקים בצורה מיוחדת?", "qe": "Why do U-joint needle bearings wear in a special way?", "ah": "הם רק מתנדנדים הלוך ושוב ולא מסתובבים סיבוב שלם, אז הגריז נדחק החוצה ונוצרים שקעים (Brinelling).", "ae": "They only rock back and forth, never a full turn, so grease gets squeezed out and dents form (brinelling).", "oh": ["רק מתנדנדים – הגריז נדחק ונוצרים שקעים", "הם מסתובבים מהר מדי ונשרפים מחום", "הם עשויים מפלסטיק רך"], "oe": ["They only rock – grease squeezes out, dents form", "They spin too fast and burn from heat", "They are made of soft plastic"], "id": 172}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "מה זה פטמת גריז (Grease Nipple / Zerk)?", "qe": "What is a grease nipple?", "ah": "פתח קטן עם שסתום, שדרכו דוחפים גריז עם משאבה ידנית.", "ae": "A small fitting with a valve through which grease is pumped by a hand gun.", "oh": ["פתח לדחיפת גריז", "בורג שמחזיק את הצלב", "חיישן שמודד חום"], "oe": ["A fitting to pump in grease", "A bolt holding the cross", "A sensor measuring heat"], "id": 173}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "למה במכוניות חדשות אין פטמת גריז בקרדן?", "qe": "Why do new cars have no grease nipple on U-joints?", "ah": "המפרקים אטומים וממולאים בגריז לכל החיים. פחות תחזוקה, אבל אי אפשר להוסיף.", "ae": "They are sealed and filled for life. Less maintenance, but you cannot add more.", "oh": ["אטומים עם גריז לכל החיים", "הם לא צריכים גריז בכלל כי הם מפלדה קשה", "כדי שיהיו זולים לתיקון"], "oe": ["Sealed with lifetime grease", "They need no grease since they're hard steel", "So they are cheap to repair"], "id": 174}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "כמה גריז לדחוף לקרדן עם פטמה?", "qe": "How much grease into a U-joint with a nipple?", "ah": "עד שרואים גריז נקי יוצא מכל ארבע הכוסות.", "ae": "Until clean grease appears from all four caps.", "oh": ["עד שגריז נקי יוצא מכל הכוסות", "כמה שיותר, עד שהוא מתפוצץ", "טיפה אחת בלבד כדי לא לפגוע באטמים"], "oe": ["Until clean grease shows at all caps", "As much as possible until it bursts", "Just one drop so the seals aren't harmed"], "id": 175}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "למה מים בגריז הורסים מסבים?", "qe": "Why does water in grease ruin bearings?", "ah": "מים גורמים לחלודה ומחלישים את שכבת הגריז, אז המתכת נוגעת במתכת.", "ae": "Water causes rust and weakens the grease film, so metal touches metal.", "oh": ["חלודה ומתכת שנוגעת במתכת", "הגריז נהיה סמיך מדי ולא מגיע למחטים", "מים מקררים יותר מדי"], "oe": ["Rust and metal-on-metal", "The grease thickens too much to reach the needles", "Water cools too much"], "id": 176}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "מה ההבדל בין גריז לשמן?", "qe": "Grease vs oil?", "ah": "גריז הוא שמן עם חומר מעבה, אז הוא נשאר במקום ולא זורם החוצה.", "ae": "Grease is oil with a thickener, so it stays put instead of running out.", "oh": ["גריז הוא שמן מעובה שנשאר במקום", "גריז הוא מים עם סבון שמחזיקים את הלכלוך", "אין שום הבדל"], "oe": ["Grease is thickened oil that stays put", "Grease is soapy water that holds dirt", "No difference at all"], "id": 177}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "למה אסור לערבב סוגי גריז שונים?", "qe": "Why not mix different grease types?", "ah": "המעבים יכולים לא להתאים, והגריז נעשה נוזלי או מתפרק ומפסיק להגן.", "ae": "The thickeners may clash, so the grease turns runny or breaks down and stops protecting.", "oh": ["המעבים לא מתאימים והגריז מתפרק", "הצבע של הגריז ייראה מוזר וקשה לבדיקה", "זה עולה יותר כסף"], "oe": ["Thickeners clash and grease breaks down", "The grease colour looks odd and is hard to inspect", "It costs more"], "id": 178}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "מה זה טבעת נעילה (Circlip) בקרדן?", "qe": "What is a circlip on a U-joint?", "ah": "טבעת קפיצית שנכנסת לחריץ ומחזיקה את הכוסות שלא ייצאו החוצה.", "ae": "A springy ring that snaps into a groove and keeps the caps from coming out.", "oh": ["טבעת שמחזיקה את הכוסות", "אטם שומר שמן בין הצלב לכוסות", "משקולת לאיזון"], "oe": ["A ring that holds the caps in", "An oil seal between cross and cups", "A balance weight"], "id": 179}, {"topic": "קרדן · מסבים ושימון (Bearings & Lubrication)", "type": "mcq", "qh": "קרדן חורק ומקיש בהתחלת נסיעה. מה הסיבה הסבירה?", "qe": "U-joint squeaks and clunks when pulling away – likely cause?", "ah": "מסבי המחטים יבשים ושחוקים, ויש רווח בצלב.", "ae": "The needle bearings are dry and worn, and the cross has play.", "oh": ["מסבים יבשים ורווח בצלב", "גל חדש מדי שעוד לא התרגל לעומס", "צמיגים מנופחים מדי"], "oe": ["Dry bearings and play in the cross", "A shaft so new it hasn't bedded in", "Overinflated tyres"], "id": 180}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "רעידה שמופיעה בתאוצה ונעלמת בשיוט. מה חשוד?", "qe": "Vibration on acceleration that goes away when cruising – suspect?", "ah": "זווית מפרקים שגויה או מפרק שחוק – הבעיה גדלה כשיש כוח גדול.", "ae": "Wrong joint angles or a worn joint – it grows when force is high.", "oh": ["זוויות מפרקים או מפרק שחוק", "צמיג שחוק בצד אחד שמרעיד בעיקר בתאוצה", "מראה שזזה ברוח"], "oe": ["Joint angles or a worn joint", "A tyre worn on one side, shaking mostly on acceleration", "A mirror moving in the wind"], "id": 181}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "הורידו את הרכב (Lowering) ועכשיו יש רעידה. למה?", "qe": "Car was lowered, now it vibrates. Why?", "ah": "זוויות הגל והמפרקים השתנו. אולי כבר לא שוות בשני הצדדים, או גדולות מדי.", "ae": "Shaft and joint angles changed. They may no longer be equal at both ends, or are too big.", "oh": ["זוויות המפרקים השתנו", "הרכב קל יותר עכשיו ולכן קופץ יותר", "השמן התקרר"], "oe": ["The joint angles changed", "The car is lighter now so it bounces more", "The oil cooled"], "id": 182}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "מה זה ספקטרום רעידות (Vibration Analysis) בתעשייה?", "qe": "What is vibration analysis in industry?", "ah": "מודדים רעידות בחיישן ומוצאים מאיזה חלק הן באות לפי התדר – לפני שמשהו נשבר.", "ae": "Measure vibration with a sensor and find the source by frequency – before something breaks.", "oh": ["מוצאים מקור לפי תדר הרעידה", "בודקים את המכונה לפי הצבע והחום שלה", "שוקלים את המכונה"], "oe": ["Find the source by vibration frequency", "Inspecting the machine by colour and heat", "Weigh the machine"], "id": 183}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "רעידה שחוזרת פעמיים בכל סיבוב של הגל. מה זה רומז?", "qe": "Vibration twice per shaft turn – what does it hint?", "ah": "זה סימן קלאסי לקרדן בזווית: המהירות עולה ויורדת פעמיים בסיבוב.", "ae": "Classic U-joint-at-an-angle sign: speed rises and falls twice per turn.", "oh": ["קרדן בזווית", "צמיג תקר", "מנוע חלש"], "oe": ["A U-joint at an angle", "A flat tyre", "A weak engine"], "id": 184}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "רעידה פעם אחת בכל סיבוב של הגל. מה זה רומז?", "qe": "Vibration once per shaft turn – what does it hint?", "ah": "בדרך כלל חוסר איזון או גל עקום.", "ae": "Usually imbalance or a bent shaft.", "oh": ["חוסר איזון או גל עקום", "קרדן שעובד ישר", "שמן חדש בדיפרנציאל"], "oe": ["Imbalance or a bent shaft", "A U-joint running straight", "New oil in the diff"], "id": 185}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "למה קרדן נשבר בדרך כלל בהתחלת נסיעה ולא בשיוט?", "qe": "Why do U-joints usually break when pulling away, not cruising?", "ah": "בהתחלה ובהילוך נמוך המומנט הכי גדול, ועוד מכה מהמצמד.", "ae": "Pulling away in low gear has the most torque, plus a jolt from the clutch.", "oh": ["המומנט הגדול ביותר במהירות נמוכה", "כי האוויר קר בבוקר", "כי הגל ארוך יותר אז"], "oe": ["Highest torque at low speed", "Because morning air is cold", "Because the shaft is longer then"], "id": 186}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "מה הסכנה בגל הינע שנשבר בנסיעה?", "qe": "Danger of a driveshaft breaking while driving?", "ah": "הקצה יכול לפגוע בכביש ולהקפיץ את הרכב או לפגוע בצנרת. לכן יש לפעמים לולאת ביטחון.", "ae": "The end can dig into the road, vault the car, or hit lines. So some have a safety loop.", "oh": ["פגיעה בכביש ובצנרת", "שום סכנה, הרכב ממשיך", "רק רעש קטן"], "oe": ["Hitting the road and pipes", "No danger, the car continues", "Just a little noise"], "id": 187}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "איך בודקים קרדן שחוק ברכב מורם?", "qe": "How do you check a worn U-joint on a lifted car?", "ah": "מחזיקים את הגל ומנסים לסובב ולהזיז הצידה. כל תזוזה או נקישה בצלב = שחוק.", "ae": "Grip the shaft and try to twist and rock it. Any movement or clunk at the cross means worn.", "oh": ["מזיזים ובודקים רווח בצלב", "מסתכלים על הצבע", "מקשיבים למנוע"], "oe": ["Rock it and check for play", "Look at the paint", "Listen to the engine"], "id": 188}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "למה רעש של מפרק נשמע לפעמים כמו מסב גלגל?", "qe": "Why can joint noise sound like a wheel bearing?", "ah": "שניהם מסתובבים עם מהירות הרכב. בודקים בסיבובים, ובהרמה של הרכב.", "ae": "Both turn with road speed. Test in turns and with the car lifted.", "oh": ["שניהם תלויים במהירות הרכב", "הם עשויים מאותו חומר", "הם תמיד באותו מקום"], "oe": ["Both depend on road speed", "They are the same material", "They are always in the same place"], "id": 189}, {"topic": "קרדן · רעידות ותקלות (Vibration & Faults)", "type": "mcq", "qh": "בראיון: \"רעידה ב-100 קמ\"ש בלבד\". מה סדר הבדיקה?", "qe": "Interview: \"vibration only at 100 km/h\" – check order?", "ah": "קודם איזון גלגלים (הכי נפוץ וזול), אחר כך גל הינע ומפרקים, ואז מסבים.", "ae": "First wheel balance (most common and cheap), then driveshaft and joints, then bearings.", "oh": ["איזון, גל ומפרקים, ואז מסבים", "קודם להחליף מנוע", "קודם להחליף תיבת הילוכים"], "oe": ["Balance, shaft and joints, then bearings", "Replace the engine first", "Replace the gearbox first"], "id": 190}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "מה זה מצמד גמיש (Flexible Coupling)?", "qe": "What is a flexible coupling?", "ah": "חיבור בין שני צירים עם חלק גמיש, שסולח על סטייה קטנה ובולע רעידות.", "ae": "A shaft connector with a flexible element that tolerates small misalignment and absorbs vibration.", "oh": ["חיבור שסולח על סטייה קטנה", "מפרק לזוויות של 45 מעלות", "בלם בין שני צירים"], "oe": ["A connector that tolerates small misalignment", "A joint for 45° angles", "A brake between two shafts"], "id": 191}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "מה זה מצמד לסתות (Jaw Coupling)?", "qe": "What is a jaw coupling?", "ah": "שני חצאים עם \"שיניים\" ובאמצע כוכב גומי. זול ונפוץ מאוד בין מנוע למשאבה.", "ae": "Two halves with jaws and a rubber spider between. Cheap and very common between motor and pump.", "oh": ["שני חצאים עם כוכב גומי", "קרדן עם שני צלבים", "רצועה עם גלגלים"], "oe": ["Two halves with a rubber spider", "A U-joint with two crosses", "A belt and pulleys"], "id": 192}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "מה זה מצמד אולדהם (Oldham Coupling)?", "qe": "What is an Oldham coupling?", "ah": "דיסקית באמצע עם שני פסים בניצב. מחברת צירים מקבילים שזזים קצת הצידה.", "ae": "A centre disc with two slots at right angles. Joins parallel shafts that are slightly offset.", "oh": ["מחבר צירים מקבילים עם הזזה", "מחבר צירים ב-90 מעלות", "מחבר צירים רק בקו ישר מושלם"], "oe": ["Joins parallel offset shafts", "Joins shafts at 90°", "Joins only perfectly aligned shafts"], "id": 193}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "מתי עדיף גלגלי שיניים קוניים על פני קרדן?", "qe": "When are bevel gears better than a U-joint?", "ah": "כשצריך זווית קבועה של 90 מעלות, וגם אולי להאט או להאיץ.", "ae": "When you need a fixed 90° turn, and maybe also a speed change.", "oh": ["זווית קבועה של 90 מעלות", "זווית שמשתנה כל הזמן", "כשאין בכלל מקום"], "oe": ["A fixed 90° angle", "An angle that keeps changing", "When there is no space at all"], "id": 194}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "למה במגוון מכונות משתמשים במצמד גמיש ולא בחיבור קשיח?", "qe": "Why use a flexible coupling instead of a rigid one in machines?", "ah": "אי אפשר ליישר שני צירים בדיוק מושלם. חיבור קשיח יעמיס על המסבים וישבור אותם.", "ae": "Two shafts can never be perfectly aligned. A rigid one loads the bearings and wrecks them.", "oh": ["יישור מושלם לא אפשרי", "מצמד גמיש תמיד חזק יותר", "מצמד קשיח רועש מדי"], "oe": ["Perfect alignment is not possible", "A flexible one is always stronger", "A rigid one is too noisy"], "id": 195}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "מה זה מצמד מפוחית (Bellows Coupling)?", "qe": "What is a bellows coupling?", "ah": "צינור מתכת דק בצורת אקורדיון. גמיש לזווית, אבל קשיח מאוד בסיבוב – טוב לרובוטים ומדפסות.", "ae": "A thin metal accordion tube. Flexible to angle but very stiff in twist – good for robots and printers.", "oh": ["אקורדיון מתכת קשיח בסיבוב", "אקורדיון גומי לשמן", "קפיץ שנמתח בסיבוב"], "oe": ["Metal accordion, stiff in twist", "Rubber accordion for oil", "A spring stretched by turning"], "id": 196}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "למה במנגנונים מדויקים לא אוהבים מצמד גומי רך?", "qe": "Why avoid a soft rubber coupling in precise mechanisms?", "ah": "הגומי מתפתל קצת בעומס, אז המיקום בצד השני לא מדויק.", "ae": "The rubber twists a bit under load, so the output position is not exact.", "oh": ["הגומי מתפתל והמיקום לא מדויק", "הגומי כבד מדי", "הגומי מעביר חשמל"], "oe": ["Rubber twists, position is off", "Rubber is too heavy", "Rubber conducts electricity"], "id": 197}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "איפה עוד יש קרדן חוץ מרכבים?", "qe": "Where else are U-joints used besides cars?", "ah": "בעמוד ההגה, במכונות חקלאיות (PTO), בכלי עבודה עם מאריך, ובמפרקי רובוטים.", "ae": "In steering columns, farm PTO shafts, tool extensions, and robot joints.", "oh": ["עמוד הגה, טרקטורים וכלי עבודה", "רק בשעונים מכניים", "רק בספינות גדולות"], "oe": ["Steering columns, tractors and tools", "Only in mechanical clocks", "Only in big ships"], "id": 198}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "מה הסכנה בגל PTO של טרקטור?", "qe": "Danger of a tractor PTO shaft?", "ah": "גל מסתובב חשוף יכול לתפוס בגדים ולמשוך אדם. חייבים כיסוי מגן.", "ae": "An exposed spinning shaft can catch clothing and pull a person in. A guard is a must.", "oh": ["תופס בגדים ומושך – חובה כיסוי", "רק רעש חזק", "הוא מתחמם מאוד"], "oe": ["Catches clothing – a guard is a must", "Just loud noise", "It gets very hot"], "id": 199}, {"topic": "קרדן · חלופות ומצמדים (Alternatives & Couplings)", "type": "mcq", "qh": "בראיון: \"חבר מנוע למשאבה בהפרש של 1 מ\"מ\". מה תבחר?", "qe": "Interview: \"connect a motor to a pump, 1 mm off\" – choose what?", "ah": "מצמד גמיש (לסתות או דיסקיות), ולשפר יישור כמה שאפשר. לא חיבור קשיח.", "ae": "A flexible coupling (jaw or disc type), and improve alignment as much as you can. Not a rigid one.", "oh": ["מצמד גמיש ושיפור יישור", "חיבור קשיח בריתוך", "קרדן כפול באורך מטר"], "oe": ["Flexible coupling and better alignment", "A rigid welded joint", "A metre-long double U-joint"], "id": 200}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה זה מעגל בסיס (Base Circle) של זיז?", "qe": "What is the base circle of a cam?", "ah": "החלק העגול של הזיז שבו השסתום סגור ולא זז.", "ae": "The round part of the cam where the valve stays shut and still.", "oh": ["החלק העגול שבו השסתום סגור", "הנקודה הכי גבוהה בזיז", "החור שבו עובר הגל"], "oe": ["The round part where the valve is shut", "The highest point of the cam", "The hole the shaft goes through"], "id": 201}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה זה עוקב שטוח (Flat Follower) לעומת עוקב גלגלת (Roller Follower)?", "qe": "Flat follower vs roller follower?", "ah": "שטוח – מחליק על הזיז, פשוט וזול. גלגלת – מתגלגלת, פחות חיכוך, אבל יותר חלקים.", "ae": "Flat slides on the cam, simple and cheap. Roller rolls – less friction, more parts.", "oh": ["שטוח מחליק, גלגלת מתגלגלת", "שניהם מחליקים באותו אופן", "גלגלת תמיד זולה יותר"], "oe": ["Flat slides, roller rolls", "Both slide the same way", "A roller is always cheaper"], "id": 202}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "למה זיז עם עלייה חדה מדי לא טוב?", "qe": "Why is a cam with too sharp a rise bad?", "ah": "השסתום מקבל \"מכה\" ותאוצה גדולה מדי. הקפיץ לא מספיק לעקוב ויש רעש ושחיקה.", "ae": "The valve gets a jolt and too much acceleration. The spring cannot keep up – noise and wear.", "oh": ["מכה, רעש ושחיקה", "המנוע יהיה שקט יותר", "הזיז יהיה קל יותר"], "oe": ["Jolts, noise and wear", "The engine gets quieter", "The cam gets lighter"], "id": 203}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה זה רמפה (Ramp) בתחילת הזיז?", "qe": "What is the ramp at the start of the lobe?", "ah": "עלייה עדינה מאוד שסוגרת את הרווח לאט, לפני שהשסתום מתחיל לזוז באמת.", "ae": "A very gentle rise that takes up the gap slowly before the valve really moves.", "oh": ["עלייה עדינה שסוגרת את הרווח", "חור לשמן בזיז", "סימן לתזמון"], "oe": ["A gentle rise that takes up the gap", "An oil hole in the lobe", "A timing mark"], "id": 204}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה זה משך (Duration) של זיז?", "qe": "What is cam duration?", "ah": "כמה מעלות מתוך סיבוב הגל ארכובה השסתום פתוח. למשל 240 מעלות.", "ae": "How many crank degrees the valve is open, e.g. 240°.", "oh": ["כמה מעלות השסתום פתוח", "כמה גבוה השסתום עולה", "כמה זמן המנוע עובד"], "oe": ["How many degrees the valve is open", "How high the valve lifts", "How long the engine runs"], "id": 205}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "זיז עם משך ארוך יותר – מתי זה עוזר?", "qe": "Longer duration – when does it help?", "ah": "בסל\"ד גבוה, כי יש יותר זמן למלא את הצילינדר. בסל\"ד נמוך המנוע יכול להיות פחות חלק.", "ae": "At high rpm, giving more time to fill the cylinder. At low rpm the engine may idle roughly.", "oh": ["בסל\"ד גבוה, על חשבון נמוך", "רק בסל\"ד נמוך מאוד", "אף פעם, זה רק מזיק"], "oe": ["At high rpm, at the cost of low rpm", "Only at very low rpm", "Never, it only hurts"], "id": 206}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה זה זיז אקסצנטרי (Eccentric) או זיז עגול מוזז?", "qe": "What is an eccentric cam?", "ah": "עיגול שהציר שלו לא במרכז. נותן תנועה חלקה למעלה ולמטה, כמו משאבת דלק מכנית.", "ae": "A circle mounted off-centre. Gives smooth up-down motion, like a mechanical fuel pump.", "oh": ["עיגול שהציר שלו לא במרכז", "זיז בצורת משולש", "זיז מגומי רך"], "oe": ["A circle with an off-centre axis", "A triangle-shaped cam", "A soft rubber cam"], "id": 207}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "למה עוקב שטוח מוזז קצת מהמרכז של הזיז?", "qe": "Why is a flat follower offset slightly from the lobe centre?", "ah": "כדי שהעוקב יסתובב לאט סביב עצמו ויישחק באופן שווה.", "ae": "So the follower slowly spins on its own axis and wears evenly.", "oh": ["כדי שיסתובב ויישחק באופן שווה", "כדי שהשסתום ייפתח מוקדם", "כדי לחסוך משקל"], "oe": ["So it rotates and wears evenly", "So the valve opens earlier", "To save weight"], "id": 208}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה זה זיז תוף (Barrel / Drum Cam)?", "qe": "What is a barrel cam?", "ah": "גליל עם חריץ מסביב. העוקב נע הלוך ושוב לאורך הגליל כשהוא מסתובב.", "ae": "A cylinder with a groove around it. The follower moves back and forth along it as it turns.", "oh": ["גליל עם חריץ שמזיז הצידה", "זיז עגול לגמרי", "גלגל שיניים פשוט"], "oe": ["A grooved cylinder that moves sideways", "A perfectly round cam", "A plain gear"], "id": 209}, {"topic": "גל זיזים · צורות זיזים ועוקבים (Cam Profiles & Followers)", "type": "mcq", "qh": "מה ההבדל בין זיז שעוקב נלחץ אליו בקפיץ לזיז עם חריץ (Positive Drive)?", "qe": "Spring-loaded follower vs grooved positive-drive cam?", "ah": "בחריץ, הזיז דוחף את העוקב גם למעלה וגם למטה – בלי קפיץ, ולא יכול \"לרחף\".", "ae": "In a groove the cam pushes the follower both ways – no spring, and it cannot float.", "oh": ["חריץ מזיז לשני הכיוונים בלי קפיץ", "אין שום הבדל בתנועה", "עם חריץ צריך שני קפיצים"], "oe": ["A groove drives both ways without a spring", "No difference in motion", "A groove needs two springs"], "id": 210}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "מה זה תזמון שסתומים משתנה (VVT)?", "qe": "What is variable valve timing?", "ah": "מזיזים קצת את זווית גל הזיזים בזמן נסיעה, כדי שהשסתומים ייפתחו מוקדם או מאוחר לפי המצב.", "ae": "The camshaft angle is shifted while driving so valves open earlier or later as needed.", "oh": ["מזיזים את זווית הגל בנסיעה", "מחליפים את גל הזיזים בכל טיפול", "מוסיפים עוד צילינדר"], "oe": ["Shifting the cam angle while driving", "Swapping the cam every service", "Adding another cylinder"], "id": 211}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "למה VVT עוזר למנוע?", "qe": "Why does VVT help an engine?", "ah": "מנוע אחד יכול להיות חלק וחסכוני בסל\"ד נמוך וחזק בסל\"ד גבוה.", "ae": "One engine can be smooth and economical at low rpm and strong at high rpm.", "oh": ["חסכוני בנמוך וחזק בגבוה", "המנוע נעשה קל יותר", "אין צורך בשמן"], "oe": ["Economical low, strong high", "The engine becomes lighter", "No oil is needed"], "id": 212}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "מה מזיז את זווית הגל ב-VVT בדרך כלל?", "qe": "What usually shifts the cam angle in VVT?", "ah": "גלגל מיוחד (Cam Phaser) בקצה הגל, שלחץ שמן מהמנוע מסובב אותו קצת.", "ae": "A special pulley (cam phaser) on the end of the shaft, turned a little by engine oil pressure.", "oh": ["גלגל מיוחד שלחץ שמן מסובב", "מנוע חשמלי גדול בצד", "הנהג עם ידית"], "oe": ["A phaser turned by oil pressure", "A big side electric motor", "The driver with a lever"], "id": 213}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "למה שמן ישן או מעט שמן גורם לבעיות VVT?", "qe": "Why does old or low oil cause VVT problems?", "ah": "המערכת עובדת בלחץ שמן. שמן מלוכלך סותם שסתומים קטנים והלחץ לא מספיק.", "ae": "The system runs on oil pressure. Dirty oil blocks small valves and pressure falls short.", "oh": ["המערכת עובדת בלחץ שמן", "השמן מקרר את החיישן", "אין קשר בכלל"], "oe": ["The system runs on oil pressure", "Oil cools the sensor", "No connection at all"], "id": 214}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "מה זה VTEC של הונדה בגדול?", "qe": "What is Honda VTEC, broadly?", "ah": "לכל שסתום יש שני זיזים: רגוע וחזק. בסל\"ד גבוה פין מחבר את הנדנד לזיז החזק.", "ae": "Each valve has two lobes: mild and wild. At high rpm a pin locks the rocker to the wild lobe.", "oh": ["שני זיזים ופין שמחליף ביניהם", "טורבו קטן על הגל", "גל זיזים חשמלי"], "oe": ["Two lobes and a pin that switches", "A small turbo on the cam", "An electric camshaft"], "id": 215}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "מה זה חפיפה (Overlap) של שסתומים?", "qe": "What is valve overlap?", "ah": "רגע קצר שבו שסתום הפליטה עוד פתוח ושסתום היניקה כבר נפתח.", "ae": "A short moment when exhaust is still open and intake has already opened.", "oh": ["רגע ששני השסתומים פתוחים", "כששני השסתומים סגורים", "כשהבוכנה למטה"], "oe": ["A moment both valves are open", "When both valves are shut", "When the piston is at the bottom"], "id": 216}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "למה חפיפה גדולה עוזרת בסל\"ד גבוה ומפריעה בסרק?", "qe": "Why does big overlap help at high rpm but hurt at idle?", "ah": "בגבוה הגזים זורמים מהר ו\"מושכים\" אוויר חדש פנימה. בסרק גז שרוף חוזר פנימה והמנוע רועד.", "ae": "At high rpm fast gas flow pulls fresh air in. At idle burnt gas flows back and the engine shakes.", "oh": ["זרימה מהירה עוזרת, בסרק גז חוזר", "בסרק המנוע חם יותר", "אין לזה השפעה בכלל"], "oe": ["Fast flow helps; at idle gas flows back", "At idle the engine is hotter", "It has no effect"], "id": 217}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "מה זה הרמה משתנה (Variable Lift)?", "qe": "What is variable lift?", "ah": "משנים כמה השסתום עולה, לא רק מתי. יש מנועים שכמעט לא צריכים מצערת בגלל זה.", "ae": "Changing how far the valve opens, not only when. Some engines barely need a throttle because of it.", "oh": ["משנים כמה השסתום עולה", "משנים את צבע השסתום", "משנים את מספר הצילינדרים"], "oe": ["Change how far the valve opens", "Change the valve colour", "Change the cylinder count"], "id": 218}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "מה זה כיבוי צילינדרים (Cylinder Deactivation)?", "qe": "What is cylinder deactivation?", "ah": "בנסיעה קלה מנתקים את השסתומים של חלק מהצילינדרים כדי שיישארו סגורים – חוסכים דלק.", "ae": "In light driving the valves of some cylinders are kept shut to save fuel.", "oh": ["שסתומים נשארים סגורים לחיסכון", "מוציאים צילינדרים מהמנוע", "מכבים את המנוע ברמזור"], "oe": ["Valves stay shut to save fuel", "Cylinders are removed", "The engine stops at lights"], "id": 219}, {"topic": "גל זיזים · תזמון משתנה (Variable Valve Timing)", "type": "mcq", "qh": "נורת מנוע עם קוד \"תזמון גל זיזים\". מה לבדוק ראשון?", "qe": "Check-engine light with a cam timing code – check first?", "ah": "מפלס ואיכות השמן, ואז את השסתום החשמלי של ה-VVT.", "ae": "Oil level and condition, then the VVT solenoid valve.", "oh": ["שמן, ואז שסתום ה-VVT", "להחליף מנוע מיד", "לנפח צמיגים"], "oe": ["Oil, then the VVT solenoid", "Replace the engine at once", "Inflate the tyres"], "id": 220}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "למה הזיזים והעוקבים צריכים שמן עם תוספי ZDDP במנועים ישנים?", "qe": "Why do old flat-tappet engines need oil with ZDDP?", "ah": "העוקבים השטוחים מחליקים בלחץ גבוה מאוד. התוסף יוצר שכבת הגנה שמונעת שחיקה מהירה.", "ae": "Flat tappets slide under very high pressure. The additive forms a protective layer against fast wear.", "oh": ["שכבת הגנה בלחץ גבוה", "כדי שהשמן יהיה אדום", "כדי שהשמן יתאדה פחות"], "oe": ["A protective layer at high pressure", "To make the oil red", "So the oil evaporates less"], "id": 221}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "מה הזמן הכי מסוכן לגל זיזים חדש?", "qe": "When is a new camshaft most at risk?", "ah": "בדקות הראשונות. לכן מורחים משחה מיוחדת ומריצים במהירות בינונית (Break-in).", "ae": "In the first minutes. That is why special paste is applied and it is run at medium rpm (break-in).", "oh": ["בדקות הראשונות להפעלה", "אחרי 100,000 ק\"מ בדיוק", "רק בחורף"], "oe": ["In the first minutes of running", "At exactly 100,000 km", "Only in winter"], "id": 222}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "איך נראה זיז שחוק?", "qe": "What does a worn lobe look like?", "ah": "הקצה העליון שטוח ונמוך, אז השסתום נפתח פחות והמנוע מאבד כוח בצילינדר הזה.", "ae": "The tip is flat and low, so that valve opens less and the cylinder loses power.", "oh": ["קצה שטוח ונמוך", "קצה גבוה וחד יותר", "הזיז נעשה אדום"], "oe": ["A flat, low tip", "A taller, sharper tip", "The lobe turns red"], "id": 223}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "איך השמן מגיע לגל זיזים בראש המנוע?", "qe": "How does oil reach a camshaft in the cylinder head?", "ah": "משאבת השמן דוחפת אותו בתעלות עד מסבי הגל, ומשם הוא מטפטף ומותז על הזיזים.", "ae": "The oil pump pushes it through passages to the cam bearings; from there it drips and sprays on the lobes.", "oh": ["משאבה דוחפת בתעלות למסבים", "הנהג שופך מלמעלה", "הוא עולה לבד מחום"], "oe": ["The pump pushes it through passages", "The driver pours it on top", "It rises on its own from heat"], "id": 224}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "למה רעש תקתוק מהראש בבוקר קר שנעלם אחרי דקה?", "qe": "Why a top-end tick on a cold morning that fades after a minute?", "ah": "לוקח רגע עד שהשמן מגיע ומתמלא במרימים ההידראוליים.", "ae": "It takes a moment for oil to reach and fill the hydraulic lifters.", "oh": ["השמן עוד לא מילא את המרימים", "השסתומים נשברו", "הדלק קר מדי"], "oe": ["Oil has not yet filled the lifters", "The valves have broken", "The fuel is too cold"], "id": 225}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "מה זה מרים הידראולי (Hydraulic Lifter)?", "qe": "What is a hydraulic lifter?", "ah": "עוקב עם שמן בפנים שמתאים את עצמו ומבטל את הרווח לבד. אין צורך לכוון.", "ae": "A follower filled with oil that adjusts itself to remove the gap. No adjusting needed.", "oh": ["עוקב שמבטל רווח לבד בעזרת שמן", "משאבה שמרימה את המכונית", "חיישן לחץ שמן"], "oe": ["A follower that self-adjusts with oil", "A pump that lifts the car", "An oil pressure sensor"], "id": 226}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "למה בחלק מהמנועים צריך לכוון מרווח שסתומים (Valve Clearance)?", "qe": "Why do some engines need valve clearance adjustment?", "ah": "יש עוקבים מכניים. השסתום נשחק עם הזמן והרווח משתנה – צריך לבדוק ולתקן.", "ae": "They have solid followers. Wear changes the gap over time, so it must be checked and set.", "oh": ["עוקבים מכניים והרווח משתנה", "כדי לשנות את צבע השסתומים", "כי השמן מתאדה"], "oe": ["Solid followers and the gap changes", "To change valve colour", "Because the oil evaporates"], "id": 227}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "מה קורה אם מרווח השסתום קטן מדי?", "qe": "What if the valve clearance is too small?", "ah": "השסתום לא נסגר עד הסוף כשהוא חם, גזים חמים בורחים והוא יכול להישרף.", "ae": "The valve does not fully close when hot; hot gas leaks past and can burn it.", "oh": ["השסתום לא נסגר ויכול להישרף", "המנוע שקט יותר", "החיסכון בדלק משתפר"], "oe": ["The valve does not seal and can burn", "The engine is quieter", "Fuel economy improves"], "id": 228}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "מה קורה אם מרווח השסתום גדול מדי?", "qe": "What if the valve clearance is too big?", "ah": "רעש תקתוק, והשסתום נפתח פחות ולזמן קצר יותר – פחות כוח.", "ae": "Ticking noise, and the valve opens less and for less time – less power.", "oh": ["תקתוק ופחות כוח", "השסתום נשרף מיד", "המנוע לא יתניע לעולם"], "oe": ["Ticking and less power", "The valve burns at once", "The engine never starts"], "id": 229}, {"topic": "גל זיזים · שימון ושחיקה (Lubrication & Wear)", "type": "mcq", "qh": "למה החלפת שמן בזמן חשובה במיוחד לגל הזיזים?", "qe": "Why are timely oil changes especially important for the cam?", "ah": "שמן ישן מאבד את התוספים וסותם תעלות קטנות, והמגע בין הזיז לעוקב נשחק.", "ae": "Old oil loses additives and clogs small passages, so the lobe-follower contact wears.", "oh": ["תוספים נגמרים ותעלות נסתמות", "שמן ישן כבד מדי למנוע", "אין לזה קשר לגל"], "oe": ["Additives wear out, passages clog", "Old oil is too heavy for the engine", "It has nothing to do with the cam"], "id": 230}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "מה זה מנוע התנגשות (Interference Engine)?", "qe": "What is an interference engine?", "ah": "מנוע שבו השסתום הפתוח והבוכנה יכולים להיות באותו מקום. אם התזמון נשבר – הם נפגשים.", "ae": "An engine where an open valve and the piston can occupy the same space. If timing breaks, they collide.", "oh": ["שסתום ובוכנה יכולים להיפגש", "מנוע שאין בו שסתומים", "מנוע עם שני גלי ארכובה"], "oe": ["Valve and piston can meet", "An engine with no valves", "An engine with two crankshafts"], "id": 231}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "מה קורה כשרצועת תזמון נקרעת במנוע התנגשות?", "qe": "What happens when the timing belt snaps in an interference engine?", "ah": "גל הזיזים נעצר, הבוכנות ממשיכות ופוגעות בשסתומים הפתוחים. השסתומים מתעקמים – תיקון יקר.", "ae": "The cam stops while pistons keep moving and hit the open valves. Bent valves – a costly repair.", "oh": ["שסתומים מתעקמים – תיקון יקר", "המנוע רק נכבה, בלי נזק", "המנוע ממשיך לעבוד רגיל"], "oe": ["Bent valves – costly repair", "It just stops, no damage", "It keeps running normally"], "id": 232}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "למה מחליפים רצועת תזמון לפי ק\"מ גם אם היא נראית טובה?", "qe": "Why replace a timing belt by mileage even if it looks fine?", "ah": "הגומי מתעייף מבפנים בלי סימנים. קריעה עולה הרבה יותר מהחלפה.", "ae": "The rubber fatigues inside without visible signs. A snap costs far more than a change.", "oh": ["הגומי מתעייף מבפנים בלי סימן", "כי הרצועה משנה צבע", "כי היא מתארכת פי 2"], "oe": ["Rubber fatigues inside unseen", "Because the belt changes colour", "Because it doubles in length"], "id": 233}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "מה מחליפים בדרך כלל יחד עם רצועת תזמון?", "qe": "What is usually replaced with a timing belt?", "ah": "גלגל מותח (Tensioner), גלגלי הובלה, ולפעמים משאבת מים שמונעת מאותה רצועה.", "ae": "The tensioner, idler pulleys, and often the water pump driven by the same belt.", "oh": ["מותח, גלגלים ומשאבת מים", "רק את המצבר", "את כל הצמיגים"], "oe": ["Tensioner, idlers and water pump", "Only the battery", "All the tyres"], "id": 234}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "שרשרת תזמון רועשת (רעשוש) בהתנעה. מה זה רומז?", "qe": "A rattling timing chain at start-up – what does it hint?", "ah": "השרשרת התארכה או שהמותח ההידראולי לא מחזיק לחץ עד שהשמן מגיע.", "ae": "The chain has stretched or the hydraulic tensioner loses pressure until oil arrives.", "oh": ["שרשרת מתוחה פחות או מותח חלש", "מצבר חלש", "צמיג חסר אוויר"], "oe": ["A stretched chain or weak tensioner", "A weak battery", "A flat tyre"], "id": 235}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "מה זה \"קפיצת שן\" (Jumped Tooth) ברצועה?", "qe": "What is a jumped tooth on a belt?", "ah": "הרצועה קפצה שן אחת על הגלגל. התזמון זז, המנוע חלש ונורת מנוע נדלקת.", "ae": "The belt skipped one tooth on a pulley. Timing is off, the engine is weak and the warning light comes on.", "oh": ["התזמון זז בשן אחת", "שן של גלגל שיניים נשברה", "השן של הנהג"], "oe": ["Timing shifted by one tooth", "A gear tooth broke", "The driver's tooth"], "id": 236}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "איך יודעים אם שסתום שרוף?", "qe": "How do you know if a valve is burned?", "ah": "בדיקת דחיסה (Compression Test) – צילינדר אחד עם לחץ נמוך בהרבה מהשאר.", "ae": "A compression test – one cylinder far lower than the others.", "oh": ["בדיקת דחיסה – צילינדר נמוך", "מסתכלים על המצבר", "מריחים את הצמיגים"], "oe": ["Compression test – one low cylinder", "Look at the battery", "Smell the tyres"], "id": 237}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "מה גורם לקפיץ שסתום להישבר?", "qe": "What causes a valve spring to break?", "ah": "עייפות ממיליוני לחיצות, סל\"ד גבוה מדי, או חלודה.", "ae": "Fatigue from millions of cycles, over-revving, or corrosion.", "oh": ["עייפות, סל\"ד יתר או חלודה", "מעט מדי דלק", "נסיעה איטית בעיר"], "oe": ["Fatigue, over-revving or corrosion", "Too little fuel", "Slow city driving"], "id": 238}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "מה הסימן לאטמי שסתום (Valve Stem Seals) שחוקים?", "qe": "Sign of worn valve stem seals?", "ah": "עשן כחול קצר בהתנעה בבוקר – שמן שזלג לצילינדר בלילה.", "ae": "A short puff of blue smoke at morning start – oil that seeped in overnight.", "oh": ["עשן כחול קצר בהתנעה", "עשן לבן מתוק כל הזמן", "אין עשן בכלל לעולם"], "oe": ["A short blue puff at start-up", "Sweet white smoke all the time", "Never any smoke"], "id": 239}, {"topic": "גל זיזים · כשלים ומנועי התנגשות (Failures & Interference)", "type": "mcq", "qh": "בראיון: \"המנוע מאבד כוח בצילינדר אחד\". מה סדר הבדיקה?", "qe": "Interview: \"one cylinder lacks power\" – check order?", "ah": "מצת וסליל, מזרק, ואז דחיסה ומרווח שסתומים. מתחילים מהזול והפשוט.", "ae": "Spark plug and coil, injector, then compression and valve clearance. Start cheap and simple.", "oh": ["מצת, מזרק, ואז דחיסה ושסתומים", "קודם להחליף את גל הזיזים", "קודם לפרק את כל המנוע"], "oe": ["Plug, injector, then compression and valves", "Replace the cam first", "Strip the whole engine first"], "id": 240}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "איפה יש זיזים בבית?", "qe": "Where are cams found at home?", "ah": "במכונת תפירה, בשעון מכני, במכונת כביסה ישנה (בורר תוכניות), ובצעצועים.", "ae": "In sewing machines, mechanical clocks, old washing-machine timers, and toys.", "oh": ["מכונת תפירה, שעון ומכונת כביסה", "רק במכוניות", "רק במטוסים"], "oe": ["Sewing machine, clock and washer", "Only in cars", "Only in aircraft"], "id": 241}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "איך זיז עוזר במכונות אריזה מהירות?", "qe": "How do cams help in fast packaging machines?", "ah": "גל אחד עם הרבה זיזים מתזמן הרבה תנועות בדיוק, אלפי פעמים בדקה.", "ae": "One shaft with many cams times many motions exactly, thousands of times a minute.", "oh": ["מתזמן הרבה תנועות בגל אחד", "מחליף את כל המנועים בחשמל", "מקרר את המוצרים"], "oe": ["Times many motions on one shaft", "Replaces all motors with electric", "Cools the products"], "id": 242}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "למה במכונות חדשות מחליפים זיזים במנועי סרוו (Servo)?", "qe": "Why are cams replaced by servo motors in new machines?", "ah": "אפשר לשנות את התנועה בתוכנה בלי לייצר זיז חדש. אבל זה יקר ומורכב יותר.", "ae": "Motion can be changed in software without making a new cam – but it is costlier and more complex.", "oh": ["משנים תנועה בתוכנה", "סרוו תמיד זול יותר", "זיזים אסורים בחוק"], "oe": ["Motion changes in software", "Servos are always cheaper", "Cams are banned"], "id": 243}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "מה זה זיז אצבע (Snail / Drop Cam)?", "qe": "What is a snail (drop) cam?", "ah": "זיז שעולה לאט ואז \"נופל\" בבת אחת. העוקב צונח – כמו פטיש בשעון.", "ae": "A cam that rises slowly then drops suddenly. The follower falls – like a clock hammer.", "oh": ["עולה לאט ונופל בבת אחת", "עגול לגמרי בלי שינוי", "עולה ויורד באותה מהירות"], "oe": ["Rises slowly and drops suddenly", "Perfectly round with no change", "Rises and falls at the same rate"], "id": 244}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "איך זיז במנעול עובד?", "qe": "How does a cam work in a lock?", "ah": "כשמסובבים מפתח, זיז קטן בגב הצילינדר דוחף את הבריח החוצה או פנימה.", "ae": "Turning the key rotates a small cam at the back of the cylinder that pushes the bolt in or out.", "oh": ["זיז דוחף את הבריח", "קפיץ מושך את הדלת", "מגנט מחזיק את המפתח"], "oe": ["A cam pushes the bolt", "A spring pulls the door", "A magnet holds the key"], "id": 245}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "מה זה ידית נעילה אקסצנטרית (Cam Lever / Quick Release)?", "qe": "What is a cam lever (quick release)?", "ah": "ידית עם זיז מוזז. כשסוגרים אותה, הזיז לוחץ חזק ומהדק – כמו בגלגל אופניים.", "ae": "A lever with an off-centre cam. Closing it squeezes and clamps hard – like a bike wheel.", "oh": ["ידית עם זיז שמהדק בסגירה", "בורג רגיל עם אום", "קפיץ שנמתח לבד"], "oe": ["A lever with a cam that clamps", "A normal bolt and nut", "A spring that stretches itself"], "id": 246}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "למה ידית אקסצנטרית לא נפתחת לבד?", "qe": "Why does a cam lever not open by itself?", "ah": "היא נסגרת קצת \"מעבר\" לנקודה הכי גבוהה, אז הכוח דוחף אותה להישאר סגורה.", "ae": "It closes slightly past the highest point, so the clamp force holds it shut.", "oh": ["נסגרת מעבר לנקודה הגבוהה", "יש בה דבק חזק", "יש בה מנעול עם מפתח"], "oe": ["It closes past the high point", "It has strong glue", "It has a key lock"], "id": 247}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "מה תפקיד זיז במשאבת דלק מכנית ישנה?", "qe": "Cam role in an old mechanical fuel pump?", "ah": "זיז על גל הזיזים מזיז מנוף שמושך ודוחף ממברנה – וכך שואב דלק.", "ae": "A cam on the camshaft moves a lever that pulls and pushes a diaphragm, pumping fuel.", "oh": ["מזיז מנוף שמפעיל ממברנה", "מחמם את הדלק", "מודד כמה דלק יש"], "oe": ["Moves a lever working a diaphragm", "Heats the fuel", "Measures fuel level"], "id": 248}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "איך משאבת דלק לחץ גבוה במנוע הזרקה ישירה מקבלת כוח?", "qe": "How is a direct-injection high-pressure fuel pump driven?", "ah": "בדרך כלל מזיז נוסף על גל הזיזים שדוחף בוכנה קטנה.", "ae": "Usually by an extra lobe on the camshaft pushing a small plunger.", "oh": ["זיז נוסף על גל הזיזים", "מנוע חשמלי בתוך המיכל", "רוח מהמאוורר"], "oe": ["An extra lobe on the camshaft", "An electric motor in the tank", "Air from the fan"], "id": 249}, {"topic": "גל זיזים · זיזים מחוץ למנוע (Cams Beyond Engines)", "type": "mcq", "qh": "בראיון: \"מתי תבחר זיז ולא מנוע סרוו?\" – מה תענה?", "qe": "Interview: \"when would you choose a cam over a servo?\"", "ah": "כשהתנועה קבועה, מהירה וחוזרת מיליוני פעמים – זיז זול, אמין ומדויק.", "ae": "When the motion is fixed, fast and repeated millions of times – a cam is cheap, reliable and precise.", "oh": ["תנועה קבועה, מהירה וחוזרת", "כשהתנועה משתנה כל יום", "כשצריך לשנות בתוכנה"], "oe": ["Fixed, fast, repeated motion", "When motion changes daily", "When it must change in software"], "id": 250}, {"type": "calc", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "מנוע מסתובב 20,000 סל\"ד (rpm) ותיבת ההילוכים מורידה פי 50. כמה מסתובב הצ׳אק?", "qe": "A motor spins at 20,000 rpm through a 50:1 reduction. Chuck speed?", "ah": "400 סל\"ד. מחלקים את מהירות המנוע ב-50: עשרים אלף חלקי חמישים זה ארבע מאות.", "ae": "400 rpm. Divide motor speed by 50: twenty thousand over fifty is four hundred.", "oh": ["400 סל\"ד", "1,000,000 סל\"ד", "2,000 סל\"ד"], "oe": ["400 rpm", "1,000,000 rpm", "2,000 rpm"], "id": 251}, {"type": "calc", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "גלגל מניע עם 10 שיניים מסובב גלגל עם 40 שיניים. מה היחס ומה קורה למהירות?", "qe": "A 10-tooth gear drives a 40-tooth gear. Ratio and speed effect?", "ah": "יחס 4 ל-1. הגלגל הגדול מסתובב פי 4 לאט יותר – כל סיבוב שלו דורש 4 סיבובים של הקטן.", "ae": "4:1. The big gear turns 4 times slower – each of its turns needs 4 turns of the small one.", "oh": ["4:1, היציאה איטית פי 4", "4:1, היציאה מהירה פי 4", "1:1, אותה מהירות"], "oe": ["4:1, output 4x slower", "4:1, output 4x faster", "1:1, same speed"], "id": 252}, {"type": "calc", "topic": "מומנט וכוח (Torque & Force)", "qh": "מנוע נותן 0.5 ניוטון-מטר (Nm) ויש הורדה של 20 ל-1, בלי הפסדים. כמה מומנט ביציאה?", "qe": "Motor gives 0.5 Nm through 20:1, no losses. Output torque?", "ah": "10 ניוטון-מטר. מה שמפסידים במהירות מרוויחים בכוח: חצי כפול עשרים זה עשר.", "ae": "10 Nm. What you lose in speed you gain in torque: half times twenty is ten.", "oh": ["10 Nm", "0.025 Nm", "20.5 Nm"], "oe": ["10 Nm", "0.025 Nm", "20.5 Nm"], "id": 253}, {"type": "calc", "topic": "מומנט וכוח (Torque & Force)", "qh": "אותה מערכת (0.5Nm, יחס 20) אבל הנצילות (Efficiency) היא 80%. כמה מומנט באמת?", "qe": "Same system (0.5 Nm, 20:1) but 80% efficiency. Real torque?", "ah": "8 ניוטון-מטר. בלי הפסדים היו 10, ו-80% מעשר זה שמונה.", "ae": "8 Nm. Lossless would be 10; 80% of ten is eight.", "oh": ["8 Nm", "10 Nm", "12.5 Nm"], "oe": ["8 Nm", "10 Nm", "12.5 Nm"], "id": 254}, {"type": "calc", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "שני שלבי הורדה אחד אחרי השני: 5 ל-1 ואז 4 ל-1. מה היחס הכולל?", "qe": "Two stages in a row: 5:1 then 4:1. Total ratio?", "ah": "20 ל-1. מכפילים את היחסים, לא מחברים: חמש כפול ארבע זה עשרים.", "ae": "20:1. Multiply ratios, don't add them: five times four is twenty.", "oh": ["20:1", "9:1", "1.25:1"], "oe": ["20:1", "9:1", "1.25:1"], "id": 255}, {"type": "calc", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "מנוע 3,000 סל\"ד עם גלגלת (Pulley) בקוטר 5 ס\"מ, רצועה לגלגלת של 15 ס\"מ. מהירות היציאה?", "qe": "3,000 rpm motor, 5 cm pulley, belt to a 15 cm pulley. Output speed?", "ah": "1,000 סל\"ד. הגלגלת הגדולה פי 3, אז היא מסתובבת פי 3 לאט יותר.", "ae": "1,000 rpm. The big pulley is 3x larger so it turns 3x slower.", "oh": ["1,000 סל\"ד", "9,000 סל\"ד", "3,000 סל\"ד"], "oe": ["1,000 rpm", "9,000 rpm", "3,000 rpm"], "id": 256}, {"type": "calc", "topic": "מומנט וכוח (Torque & Force)", "qh": "מושכים 100 ניוטון (N) בקצה מפתח באורך 25 ס\"מ. כמה מומנט על הבורג?", "qe": "You pull 100 N at the end of a 25 cm wrench. Torque on the bolt?", "ah": "25 ניוטון-מטר. כוח כפול המרחק במטרים: מאה כפול רבע מטר.", "ae": "25 Nm. Force times distance in metres: one hundred times a quarter metre.", "oh": ["25 Nm", "2,500 Nm", "4 Nm"], "oe": ["25 Nm", "2,500 Nm", "4 Nm"], "id": 257}, {"type": "calc", "topic": "מומנט וכוח (Torque & Force)", "qh": "צריך 40 ניוטון-מטר ויש ידית של 40 ס\"מ. באיזה כוח צריך למשוך?", "qe": "You need 40 Nm with a 40 cm handle. How hard must you pull?", "ah": "100 ניוטון (בערך משקל של 10 ק\"ג). מחלקים את המומנט באורך במטרים: ארבעים חלקי 0.4.", "ae": "100 N (about the weight of 10 kg). Divide torque by length in metres: forty over 0.4.", "oh": ["100 N", "16 N", "1,600 N"], "oe": ["100 N", "16 N", "1,600 N"], "id": 258}, {"type": "calc", "topic": "דיפרנציאל (Differential)", "qh": "בסיבוב, בית הדיפרנציאל מסתובב 100 סל\"ד והגלגל הפנימי 90. כמה הגלגל החיצוני?", "qe": "In a turn the differential case spins 100 rpm and the inner wheel 90. Outer wheel?", "ah": "110 סל\"ד. מה שגלגל אחד מאבד השני מקבל – הממוצע של שניהם תמיד שווה למהירות הבית.", "ae": "110 rpm. What one wheel loses the other gains – their average always equals the case speed.", "oh": ["110 סל\"ד", "100 סל\"ד", "190 סל\"ד"], "oe": ["110 rpm", "100 rpm", "190 rpm"], "id": 259}, {"type": "calc", "topic": "דיפרנציאל (Differential)", "qh": "גל ההינע (Driveshaft) מסתובב 2,000 סל\"ד וההאטה הסופית (Final Drive) היא 4 ל-1. מהירות הגלגלים בנסיעה ישרה?", "qe": "Driveshaft at 2,000 rpm, final drive 4:1. Wheel speed going straight?", "ah": "500 סל\"ד. אלפיים חלקי ארבע. בנסיעה ישרה שני הגלגלים באותה מהירות.", "ae": "500 rpm. Two thousand over four; going straight both wheels match.", "oh": ["500 סל\"ד", "8,000 סל\"ד", "250 סל\"ד"], "oe": ["500 rpm", "8,000 rpm", "250 rpm"], "id": 260}, {"type": "calc", "topic": "ראצ׳ט ומצמד (Ratchet & Clutch)", "qh": "לגלגל ראצ׳ט יש 36 שיניים. כמה מעלות זה \"קליק\" אחד?", "qe": "A ratchet wheel has 36 teeth. How many degrees per click?", "ah": "10 מעלות. סיבוב שלם הוא 360 מעלות, מחולק ל-36 שיניים.", "ae": "10 degrees. A full turn is 360 degrees split over 36 teeth.", "oh": ["10 מעלות", "36 מעלות", "1 מעלה"], "oe": ["10°", "36°", "1°"], "id": 261}, {"type": "calc", "topic": "ראצ׳ט ומצמד (Ratchet & Clutch)", "qh": "ראצ׳ט של 72 שיניים לעומת 36. איזה צריך פחות מקום לסיבוב הידית, ובכמה?", "qe": "72-tooth vs 36-tooth ratchet. Which needs less handle swing, by how much?", "ah": "ה-72: כל קליק 5 מעלות במקום 10 – חצי תנועה. טוב במקומות צפופים, אבל כל שן קטנה וחלשה יותר.", "ae": "The 72: 5° per click instead of 10° – half the swing. Great in tight spots, but each tooth is smaller and weaker.", "oh": ["72 – חצי תנועה (5° במקום 10°)", "36 – כי יש פחות שיניים", "אין הבדל"], "oe": ["72 – half the swing (5° vs 10°)", "36 – fewer teeth", "No difference"], "id": 262}, {"type": "calc", "topic": "גל זיזים (Camshaft)", "qh": "במנוע ארבע פעימות גל הארכובה (Crankshaft) מסתובב 3,000 סל\"ד. כמה גל הזיזים?", "qe": "In a 4-stroke engine the crankshaft spins 3,000 rpm. Camshaft speed?", "ah": "1,500 סל\"ד. כל שסתום נפתח פעם בשני סיבובי ארכובה, לכן גל הזיזים בחצי מהירות.", "ae": "1,500 rpm. Each valve opens once every two crank turns, so the cam runs at half speed.", "oh": ["1,500 סל\"ד", "3,000 סל\"ד", "6,000 סל\"ד"], "oe": ["1,500 rpm", "3,000 rpm", "6,000 rpm"], "id": 263}, {"type": "calc", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "בורג חילזון (Worm) עם התחלה אחת מסובב גלגל של 30 שיניים, המנוע 1,500 סל\"ד. מהירות היציאה?", "qe": "Single-start worm drives a 30-tooth wheel, motor at 1,500 rpm. Output speed?", "ah": "50 סל\"ד. כל סיבוב של החילזון מזיז שן אחת, אז היחס 30 ל-1: אלף וחמש מאות חלקי שלושים.", "ae": "50 rpm. Each worm turn moves one tooth, so 30:1: fifteen hundred over thirty.", "oh": ["50 סל\"ד", "45,000 סל\"ד", "1,500 סל\"ד"], "oe": ["50 rpm", "45,000 rpm", "1,500 rpm"], "id": 264}, {"type": "calc", "topic": "מנועים וסוללות (Motors & Power)", "qh": "מנוע נותן 10 ניוטון-מטר בערך ב-955 סל\"ד. בערך כמה הספק (Power)?", "qe": "A motor gives 10 Nm at about 955 rpm. Roughly what power?", "ah": "בערך 1,000 וואט (1 קילוואט). כלל אצבע: מכפילים מומנט בסל\"ד ומחלקים בערך ב-9.5 – עשר כפול 955 חלקי 9.55 זה אלף.", "ae": "About 1,000 W (1 kW). Rule of thumb: torque times rpm, divided by about 9.5 – ten times 955 over 9.55 is a thousand.", "oh": ["כ-1,000 וואט", "כ-10 וואט", "כ-9,550 וואט"], "oe": ["About 1,000 W", "About 10 W", "About 9,550 W"], "id": 265}, {"type": "calc", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "גלגל שיניים (Pinion) עם היקף של 10 ס\"מ מסתובב 3 סיבובים על מסילת שיניים (Rack). כמה המסילה זזה?", "qe": "A pinion with a 10 cm circumference turns 3 times on a rack. How far does the rack move?", "ah": "30 ס\"מ. כל סיבוב מזיז את המסילה היקף אחד.", "ae": "30 cm. Each turn moves the rack one circumference.", "oh": ["30 ס\"מ", "3.3 ס\"מ", "10 ס\"מ"], "oe": ["30 cm", "3.3 cm", "10 cm"], "id": 266}, {"type": "calc", "topic": "מנועים וסוללות (Motors & Power)", "qh": "סוללה של 18 וולט ו-4 אמפר-שעה (Ah). בערך כמה אנרגיה יש בה?", "qe": "An 18 V, 4 Ah battery. Roughly how much energy?", "ah": "72 וואט-שעה. מכפילים וולט באמפר-שעה: שמונה עשרה כפול ארבע.", "ae": "72 Wh. Multiply volts by amp-hours: eighteen times four.", "oh": ["72 Wh", "22 Wh", "4.5 Wh"], "oe": ["72 Wh", "22 Wh", "4.5 Wh"], "id": 267}, {"type": "mistake", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "האם גלגלי שיניים מגדילים את ההספק (Power)?", "qe": "Do gears increase power?", "wrong_h": "\"כן, הורדה נותנת יותר כוח, אז יותר הספק.\"", "wrong_e": "\"Yes, reduction gives more force so more power.\"", "ah": "לא. גלגלי שיניים מחליפים מהירות במומנט. ההספק נשאר אותו דבר ואפילו קצת יורד בגלל חיכוך.", "ae": "No. Gears trade speed for torque. Power stays the same and even drops a bit to friction.", "id": 268}, {"type": "mistake", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "שני שלבים 3:1 ו-4:1 – מה היחס הכולל?", "qe": "Stages 3:1 and 4:1 – total ratio?", "wrong_h": "\"7 ל-1 – מחברים.\"", "wrong_e": "\"7:1 – add them.\"", "ah": "12 ל-1. יחסים בשרשרת מכפילים.", "ae": "12:1. Ratios in series multiply.", "id": 269}, {"type": "mistake", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "גלגל ביניים (Idler) בין שני גלגלים – מה הוא משנה?", "qe": "An idler gear between two gears – what does it change?", "wrong_h": "\"הוא משנה את היחס.\"", "wrong_e": "\"It changes the ratio.\"", "ah": "הוא רק הופך את כיוון הסיבוב (ומגשר על מרחק). היחס נקבע רק על ידי הגלגל הראשון והאחרון.", "ae": "It only reverses direction (and bridges distance). The ratio depends only on the first and last gear.", "id": 270}, {"type": "mistake", "topic": "מנועים וסוללות (Motors & Power)", "qh": "מתי מנוע DC מושך הכי הרבה זרם?", "qe": "When does a DC motor draw the most current?", "wrong_h": "\"במהירות מקסימלית.\"", "wrong_e": "\"At top speed.\"", "ah": "כשהוא תקוע (Stall) או בהתנעה. אין סיבוב שמייצר \"מתח נגדי\", אז הזרם קופץ.", "ae": "When stalled or starting. No rotation means no back-voltage, so current spikes.", "id": 271}, {"type": "mistake", "topic": "דיפרנציאל (Differential)", "qh": "למה צריך דיפרנציאל?", "qe": "Why do you need a differential?", "wrong_h": "\"כדי לחלק את הכוח שווה בין הגלגלים בכל מצב.\"", "wrong_e": "\"To split power equally between wheels at all times.\"", "ah": "כדי לאפשר לגלגלים להסתובב במהירויות שונות בסיבוב. המומנט אמנם מתחלק שווה, אבל בגלל זה גלגל שמחליק \"גונב\" את הכל.", "ae": "To let wheels turn at different speeds in a corner. Torque is split equally, which is exactly why a slipping wheel gets all the motion.", "id": 272}, {"type": "mistake", "topic": "דיפרנציאל (Differential)", "qh": "גלגל אחד על קרח והשני על אספלט – מה קורה בדיפרנציאל פתוח?", "qe": "One wheel on ice, one on asphalt – open differential?", "wrong_h": "\"הגלגל על האספלט מקבל את כל הכוח ומושך.\"", "wrong_e": "\"The asphalt wheel gets all the power and pulls.\"", "ah": "הגלגל על הקרח מסתובב בחופשיות והמכונית לא זזה. שני הגלגלים מקבלים מומנט נמוך כמו של הגלגל המחליק.", "ae": "The ice wheel spins and the car stays put. Both wheels get only as much torque as the slipping wheel can hold.", "id": 273}, {"type": "mistake", "topic": "מומנט וכוח (Torque & Force)", "qh": "איך מגדילים מומנט על בורג תקוע עם אותו כוח?", "qe": "How to get more torque on a stuck bolt with the same force?", "wrong_h": "\"לדחוף מהר יותר.\"", "wrong_e": "\"Push faster.\"", "ah": "להאריך את הידית. מומנט זה כוח כפול מרחק – ידית כפולה, מומנט כפול.", "ae": "Use a longer handle. Torque is force times distance – double the handle, double the torque.", "id": 274}, {"type": "mistake", "topic": "מפרק קרדן (U-joint)", "qh": "מפרק קרדן (U-joint) בזווית – האם מהירות היציאה אחידה?", "qe": "A U-joint at an angle – is output speed uniform?", "wrong_h": "\"כן, כמו ציר ישר.\"", "wrong_e": "\"Yes, like a straight shaft.\"", "ah": "לא. בזווית היציאה מאיצה ומאטה פעמיים בכל סיבוב. מתקנים עם שני מפרקים בפאזה נכונה או מפרק הומוקינטי (CV).", "ae": "No. At an angle the output speeds up and slows down twice per turn. Fix with two joints phased correctly or a CV joint.", "id": 275}, {"type": "mistake", "topic": "ראצ׳ט ומצמד (Ratchet & Clutch)", "qh": "מה תפקיד הקפיץ על לשונית הראצ׳ט (Pawl)?", "qe": "What does the pawl spring do?", "wrong_h": "\"נותן את הכוח שמסובב את הבורג.\"", "wrong_e": "\"It provides the force that turns the bolt.\"", "ah": "רק מחזיק את הלשונית צמודה לשיניים. הכוח עובר דרך הלשונית והשן עצמן, לא דרך הקפיץ.", "ae": "It only keeps the pawl against the teeth. The load goes through the pawl and tooth, not the spring.", "id": 276}, {"type": "mistake", "topic": "גל זיזים (Camshaft)", "qh": "למה גל הזיזים מסתובב בחצי ממהירות הארכובה?", "qe": "Why does the camshaft turn at half crank speed?", "wrong_h": "\"כדי להפחית שחיקה.\"", "wrong_e": "\"To reduce wear.\"", "ah": "כי במנוע ארבע פעימות כל שסתום נפתח פעם אחת בכל שני סיבובי ארכובה.", "ae": "Because in a 4-stroke each valve opens once every two crank turns.", "id": 277}, {"type": "mistake", "topic": "מנועים וסוללות (Motors & Power)", "qh": "למה לא לחבר מנוע ישר לצ׳אק בלי תיבת הילוכים?", "qe": "Why not connect the motor straight to the chuck?", "wrong_h": "\"כי המנוע יסתובב לאט מדי.\"", "wrong_e": "\"Because the motor would be too slow.\"", "ah": "ההפך: המנוע מהיר מדי וחלש מדי. ההורדה מורידה מהירות ומגדילה מומנט לרמה שימושית.", "ae": "The opposite: the motor is too fast and too weak. The reduction lowers speed and raises torque to a useful level.", "id": 278}, {"type": "mistake", "topic": "כללי (General)", "qh": "מה ההבדל בין חוזק (Strength) לקשיחות (Stiffness)?", "qe": "Strength vs stiffness?", "wrong_h": "\"זה אותו דבר.\"", "wrong_e": "\"They are the same thing.\"", "ah": "קשיחות – כמה החלק מתכופף תחת עומס. חוזק – באיזה עומס הוא נשבר או מתעוות לתמיד. חלק יכול להיות חזק אבל גמיש.", "ae": "Stiffness is how much it bends under load; strength is the load at which it breaks or bends permanently. A part can be strong yet flexible.", "id": 279}, {"type": "mistake", "topic": "כללי (General)", "qh": "מסב (Bearing) מתחמם ורועש – מה הצעד הראשון?", "qe": "A bearing runs hot and noisy – first step?", "wrong_h": "\"להוסיף עוד הרבה גריז.\"", "wrong_e": "\"Add lots more grease.\"", "ah": "לבדוק סיבה: יישור, עומס, זיהום, כמות שימון נכונה. יותר מדי גריז גם הוא מחמם מסב.", "ae": "Find the cause: alignment, load, contamination, correct lube amount. Too much grease also overheats a bearing.", "id": 280}, {"type": "mistake", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "למה לבחור בורג חילזון (Worm) במנגנון הרמה?", "qe": "Why use a worm gear in a lift?", "wrong_h": "\"כי הוא הכי יעיל.\"", "wrong_e": "\"Because it is the most efficient.\"", "ah": "כי הוא נותן יחס גדול בשלב אחד ולרוב לא ניתן להנעה לאחור – העומס לא יפיל את עצמו. הנצילות דווקא נמוכה.", "ae": "Big ratio in one stage, and usually it can't be back-driven so the load holds itself. Efficiency is actually low.", "id": 281}, {"type": "mistake", "topic": "מומנט וכוח (Torque & Force)", "qh": "מצמד מומנט (Torque Clutch) במברגה \"מקפץ\" – זה תקלה?", "qe": "Drill torque clutch is clicking – is that a fault?", "wrong_h": "\"כן, המצמד שבור.\"", "wrong_e": "\"Yes, the clutch is broken.\"", "ah": "לא, זה התפקיד שלו: הגיע למומנט שנבחר והוא מחליק כדי לא להדק יותר מדי או לשבור את הבורג.", "ae": "No, that's its job: it reached the set torque and slips so the screw isn't overtightened or snapped.", "id": 282}, {"type": "interview", "topic": "כללי (General)", "qh": "ספר לי על מנגנון שאתה מכיר היטב.", "qe": "Tell me about a mechanism you know well.", "ah": "בוחרים מנגנון אחד (למשל מברגה), מתארים מה הוא עושה, מה הקלט והפלט, איך הכוח עובר, איזו בעיה הוא פותר ומה הייתי משפר.", "ae": "Pick one mechanism (e.g. a drill), say what it does, input and output, how power flows, what problem it solves, and what you would improve.", "points_h": ["מטרה במשפט אחד", "קלט → חלקים → פלט", "מספר אחד (יחס, סל\"ד, מומנט)", "נקודת כשל אפשרית", "שיפור שהייתי עושה"], "points_e": ["Purpose in one sentence", "Input → parts → output", "One number (ratio, rpm, torque)", "A likely failure point", "An improvement you would make"], "id": 283}, {"type": "interview", "topic": "כללי (General)", "qh": "ספר על פרויקט שבו משהו לא עבד ואיך פתרת.", "qe": "Tell me about a project where something failed and how you fixed it.", "ah": "מבנה STAR: מצב, משימה, פעולה, תוצאה. להדגיש איך מצאת את שורש הבעיה ומה למדת.", "ae": "STAR: situation, task, action, result. Stress how you found the root cause and what you learned.", "points_h": ["תיאור קצר של הבעיה", "איך בדקת (מדידה, ניסוי)", "שורש הבעיה", "התיקון והתוצאה במספרים", "מה היית עושה אחרת"], "points_e": ["Short problem description", "How you investigated (measure, test)", "Root cause", "Fix and result in numbers", "What you would do differently"], "id": 284}, {"type": "interview", "topic": "גלגלי שיניים ויחסים (Gears & Ratios)", "qh": "איך תבחר יחס הילוכים למברגה חדשה?", "qe": "How would you choose a gear ratio for a new drill?", "ah": "מתחילים מהדרישה (מומנט וסל\"ד בצ׳אק), בודקים מה המנוע נותן, והיחס הוא מהירות המנוע חלקי המהירות הנדרשת – ואז בודקים שהמומנט מספיק עם הפסדים.", "ae": "Start from requirements (chuck torque and rpm), check what the motor gives; ratio = motor speed over needed speed, then confirm torque is enough after losses.", "points_h": ["דרישות קודם", "נתוני המנוע", "חישוב יחס", "בדיקת מומנט עם נצילות", "מספר שלבים, רעש, מחיר"], "points_e": ["Requirements first", "Motor data", "Calculate ratio", "Check torque with efficiency", "Stages, noise, cost"], "id": 285}, {"type": "interview", "topic": "דיפרנציאל (Differential)", "qh": "הסבר דיפרנציאל לילד בן 10.", "qe": "Explain a differential to a 10-year-old.", "ah": "בסיבוב הגלגל החיצוני עובר דרך ארוכה יותר, אז הוא צריך להסתובב מהר יותר. הדיפרנציאל נותן לכל גלגל להסתובב בקצב שלו ועדיין לקבל כוח מהמנוע.", "ae": "In a turn the outer wheel travels farther so it must spin faster. The differential lets each wheel spin at its own pace while both still get power.", "points_h": ["שפה פשוטה", "דוגמת סיבוב", "מה היה קורה בלעדיו", "חיסרון: גלגל מחליק"], "points_e": ["Plain words", "Cornering example", "What happens without it", "Downside: slipping wheel"], "id": 286}, {"type": "interview", "topic": "כללי (General)", "qh": "איך היית בודק שחלק חדש עמיד לפני ייצור?", "qe": "How would you verify a new part is durable before production?", "ah": "חישוב ראשוני, סימולציה (FEA) אם צריך, אב-טיפוס, ובדיקות עומס ומחזורים מעבר לשימוש האמיתי עם מקדם ביטחון.", "ae": "Hand calcs, FEA if needed, prototype, then load and cycle tests beyond real use with a safety factor.", "points_h": ["חישוב ומקדם ביטחון", "סימולציה", "אב-טיפוס", "בדיקת חיים (מחזורים)", "ניתוח כשלים ותיקון"], "points_e": ["Calcs and safety factor", "Simulation", "Prototype", "Life (cycle) test", "Failure analysis and fix"], "id": 287}, {"type": "interview", "topic": "כללי (General)", "qh": "מתי תבחר מנוע + חיישן ומתי מנגנון מכני טהור?", "qe": "When choose motor + sensor vs a purely mechanical mechanism?", "ah": "מכני כשהתנועה קבועה, זולה ואמינה (זיז, ראצ׳ט). אלקטרוני כשצריך לשנות תנועה, למדוד או לשלוט – במחיר מורכבות.", "ae": "Mechanical when motion is fixed, cheap and reliable (cam, ratchet). Electronic when motion must change, be measured or controlled – at the cost of complexity.", "points_h": ["גמישות מול פשטות", "מחיר ואמינות", "דוגמה לכל צד", "תחזוקה"], "points_e": ["Flexibility vs simplicity", "Cost and reliability", "Example for each", "Maintenance"], "id": 288}, {"type": "interview", "topic": "ראצ׳ט ומצמד (Ratchet & Clutch)", "qh": "איך עובד ראצ׳ט, ומה החולשה שלו?", "qe": "How does a ratchet work and what is its weak point?", "ah": "לשונית קפיצית נכנסת לשיניים ומאפשרת תנועה רק לכיוון אחד. החולשה: השן והלשונית סופגות את כל העומס – שחיקה או שבירה בעומס יתר.", "ae": "A spring pawl engages teeth allowing motion one way only. Weak point: tooth and pawl carry all the load – wear or breakage on overload.", "points_h": ["חד-כיווניות", "לשונית + קפיץ + שיניים", "מספר שיניים מול חוזק", "כשל אופייני"], "points_e": ["One-way action", "Pawl + spring + teeth", "Tooth count vs strength", "Typical failure"], "id": 289}, {"type": "interview", "topic": "מפרק קרדן (U-joint)", "qh": "למה ברכבים יש מפרקים הומוקינטיים (CV) בגלגלים הקדמיים?", "qe": "Why do cars use CV joints at the front wheels?", "ah": "כי הגלגלים גם מסתובבים וגם מוגים בזוויות גדולות; מפרק CV מעביר מהירות אחידה גם בזווית, בניגוד לקרדן.", "ae": "Front wheels both drive and steer at large angles; a CV joint keeps speed uniform at angle, unlike a U-joint.", "points_h": ["בעיית הקרדן בזווית", "זוויות היגוי גדולות", "נוחות ורעידות", "גומיית מגן (Boot) – נקודת כשל"], "points_e": ["U-joint speed issue", "Large steering angles", "Smoothness/vibration", "Boot as failure point"], "id": 290}, {"type": "interview", "topic": "גל זיזים (Camshaft)", "qh": "מה היית משנה בפרופיל זיז כדי לקבל יותר הספק במנוע?", "qe": "What would you change in a cam profile for more engine power?", "ah": "הרמה גבוהה יותר ו/או משך פתיחה ארוך יותר כדי להכניס יותר אוויר בסל\"ד גבוה – על חשבון סרק חלק ומומנט נמוך.", "ae": "More lift and/or longer duration to breathe better at high rpm – at the cost of idle quality and low-end torque.", "points_h": ["הרמה (Lift)", "משך (Duration)", "פשרה בסל\"ד נמוך", "קפיצי שסתום"], "points_e": ["Lift", "Duration", "Low-rpm trade-off", "Valve springs"], "id": 291}, {"type": "interview", "topic": "כללי (General)", "qh": "למה אתה רוצה לעבוד כמהנדס מכונות אצלנו?", "qe": "Why do you want to work as a mechanical engineer here?", "ah": "לקשר בין מה שהחברה מייצרת לבין מה שאתה אוהב לבנות, עם דוגמה קונקרטית ממה שלמדת או בנית.", "ae": "Connect what the company builds to what you love building, with one concrete example of something you learned or built.", "points_h": ["מחקר על החברה", "דוגמה אישית", "מה תתרום", "מה תרצה ללמוד"], "points_e": ["Research the company", "Personal example", "What you bring", "What you want to learn"], "id": 292}, {"type": "interview", "topic": "מנועים וסוללות (Motors & Power)", "qh": "מברגה מתחממת מהר בעבודה כבדה. מה תבדוק?", "qe": "A drill overheats under heavy work. What do you check?", "ah": "זרם המנוע ותקיעות, נצילות התמסורת (חיכוך, שימון), אוורור, והאם המשתמש עובד במהירות הלא נכונה.", "ae": "Motor current and stalls, gearbox efficiency (friction, lube), cooling airflow, and whether the user is in the wrong speed setting.", "points_h": ["מדידת זרם וטמפרטורה", "תמסורת ושימון", "קירור", "שימוש לא נכון", "הגנה תרמית"], "points_e": ["Measure current and temperature", "Gearbox and lube", "Cooling", "Misuse", "Thermal protection"], "id": 293}, {"type": "interview", "topic": "כללי (General)", "qh": "יש לך שתי דקות: תכנן מתקן שמרים 50 ק\"ג לגובה מטר.", "qe": "Two minutes: design a device to lift 50 kg one metre.", "ah": "לשאול שאלות (מהירות, תדירות, בטיחות), להציע פתרון פשוט – מנוע + חילזון + בורג הרמה שלא נופל לבד – ולהעריך מומנט והספק.", "ae": "Ask questions (speed, frequency, safety), propose something simple – motor + worm/lead screw that self-holds – and estimate torque and power.", "points_h": ["שאלות הבהרה", "רעיון פשוט קודם", "חישוב גס", "בטיחות (בלם/ננעל)", "חלופות"], "points_e": ["Clarifying questions", "Simple idea first", "Rough calc", "Safety (brake/self-lock)", "Alternatives"], "id": 294}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "מה התפקיד של רצועה (Belt) במכונה?", "qe": "What does a belt do in a machine?", "ah": "מעבירה סיבוב בין שני צירים רחוקים, בשקט ובזול.", "ae": "Transfers rotation between distant shafts, quietly and cheaply.", "oh": ["מעבירה סיבוב בין צירים מרוחקים", "נועלת את הציר כשהמכונה כבויה", "מגבירה את ההספק שהמנוע מייצר"], "oe": ["Transfers rotation between distant shafts", "Locks the shaft when the machine is off", "Raises the power the motor produces"], "id": 295}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "למה רצועת תזמון (Timing Belt) עם שיניים ולא חלקה?", "qe": "Why does a timing belt have teeth?", "ah": "השיניים מונעות החלקה, כך ששני הצירים נשארים מתואמים בדיוק.", "ae": "Teeth prevent slip so both shafts stay exactly in sync.", "oh": ["כדי שלא תחליק ותשמור על תזמון", "כדי שתהיה גמישה יותר בסיבובים", "כדי לקרר את הגלגלות תוך כדי עבודה"], "oe": ["So it can't slip and keeps timing", "So it bends more easily round pulleys", "To cool the pulleys while running"], "id": 296}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "מה היתרון של רצועת V (V-Belt) על רצועה שטוחה?", "qe": "Advantage of a V-belt over a flat belt?", "ah": "הצורה נתקעת בחריץ ונותנת אחיזה חזקה יותר באותו מתח.", "ae": "The wedge shape grips the groove harder at the same tension.", "oh": ["אחיזה טובה יותר בגלל צורת הטריז", "מהירות מקסימלית גבוהה בהרבה", "לא צריכה מתיחה בכלל לעולם"], "oe": ["Better grip from the wedge shape", "Much higher top speed", "Never needs any tension"], "id": 297}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "מה קורה אם רצועה רפויה מדי?", "qe": "What happens if a belt is too loose?", "ah": "היא מחליקה, חורקת, מתחממת ונשחקת מהר.", "ae": "It slips, squeals, heats and wears fast.", "oh": ["מחליקה, חורקת ונשחקת", "מסובבת מהר יותר את הגלגלת", "מעמיסה יותר על המסבים"], "oe": ["Slips, squeals and wears", "Spins the pulley faster", "Loads the bearings more"], "id": 298}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "מה קורה אם רצועה מתוחה מדי?", "qe": "What happens if a belt is too tight?", "ah": "עומס גדול על המסבים והצירים, והרצועה עצמה נשחקת מהר.", "ae": "High load on bearings and shafts, and the belt wears quickly.", "oh": ["עומס יתר על מסבים וצירים", "היא מתחילה להחליק יותר", "יחס ההעברה משתנה מאוד"], "oe": ["Overloads bearings and shafts", "It starts slipping more", "The ratio changes a lot"], "id": 299}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "למה מערכות רצועה רבות כוללות גלגלת מותחת (Tensioner)?", "qe": "Why do many belt drives use a tensioner?", "ah": "רצועה מתארכת עם הזמן; המותח שומר על מתח נכון אוטומטית.", "ae": "Belts stretch over time; the tensioner keeps tension right automatically.", "oh": ["לשמור על מתח נכון כשהרצועה מתארכת", "להגדיל את יחס ההעברה בזמן עבודה", "לשמש בלם כשהמנוע נעצר"], "oe": ["Keep tension as the belt stretches", "Raise the ratio while running", "Act as a brake when stopping"], "id": 300}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "יתרון חשוב של רצועה על גלגלי שיניים בעומס פתאומי?", "qe": "Key belt advantage over gears under shock load?", "ah": "הרצועה גמישה ויכולה להחליק מעט, אז היא בולעת מכות ומגינה על המנוע.", "ae": "The belt flexes and can slip a little, absorbing shocks and protecting the motor.", "oh": ["בולעת מכות ומגינה על המערכת", "מעבירה מומנט גבוה יותר מכל גלגל", "לעולם לא צריכה החלפה"], "oe": ["Absorbs shocks and protects parts", "Carries more torque than any gear", "Never needs replacing"], "id": 301}, {"type": "mcq", "topic": "רצועות (Belts)", "qh": "למה לא כדאי שהגלגלת הקטנה תהיה קטנה מאוד?", "qe": "Why avoid a very small small pulley?", "ah": "הרצועה מתכופפת חזק מדי ומתעייפת, ויש מעט שטח מגע אז היא מחליקה.", "ae": "The belt bends too sharply and fatigues, and the small contact area slips.", "oh": ["כיפוף חד מעייף את הרצועה", "הגלגלת תסתובב לאט מדי", "הרצועה תתחמם פחות מדי"], "oe": ["Sharp bending fatigues the belt", "The pulley would turn too slowly", "The belt would run too cool"], "id": 302}, {"type": "calc", "topic": "רצועות (Belts)", "qh": "גלגלת מנוע 8 ס\"מ, גלגלת מכונה 24 ס\"מ, המנוע 1,500 סל\"ד (rpm). מהירות המכונה?", "qe": "Motor pulley 8 cm, machine pulley 24 cm, motor 1,500 rpm. Machine speed?", "ah": "500 סל\"ד. הגלגלת הגדולה פי 3, אז היא מסתובבת פי 3 לאט: אלף וחמש מאות חלקי שלוש.", "ae": "500 rpm. The big pulley is 3x larger, so it turns 3x slower.", "oh": ["500 סל\"ד", "4,500 סל\"ד", "1,000 סל\"ד"], "oe": ["500 rpm", "4,500 rpm", "1,000 rpm"], "id": 303}, {"type": "calc", "topic": "רצועות (Belts)", "qh": "גלגלת בקוטר 10 ס\"מ מסתובבת 600 סל\"ד. בערך באיזו מהירות זזה הרצועה?", "qe": "A 10 cm pulley spins at 600 rpm. Roughly how fast does the belt move?", "ah": "בערך 3 מטר בשנייה. היקף הגלגלת כ-31 ס\"מ, 600 סיבובים בדקה הם 10 בשנייה, אז כ-3.1 מטר בשנייה.", "ae": "About 3 m/s. Circumference is about 31 cm, 600 rpm is 10 turns per second, so about 3.1 m/s.", "oh": ["כ-3 מטר בשנייה", "כ-60 מטר בשנייה", "כ-0.3 מטר בשנייה"], "oe": ["About 3 m/s", "About 60 m/s", "About 0.3 m/s"], "id": 304}, {"type": "mistake", "topic": "רצועות (Belts)", "qh": "רצועה חלקה מחליקה. מה הפתרון הראשון?", "qe": "A flat belt slips. First fix?", "wrong_h": "\"למרוח שמן כדי שתזוז חלק.\"", "wrong_e": "\"Oil it so it runs smoothly.\"", "ah": "ההפך – שמן מגביר החלקה. בודקים מתח, ניקיון ושחיקה, ומתקנים מתיחה או מחליפים.", "ae": "The opposite – oil increases slip. Check tension, cleanliness and wear, then re-tension or replace.", "id": 305}, {"type": "mistake", "topic": "רצועות (Belts)", "qh": "האם יחס ההעברה ברצועת V מדויק בדיוק כמו בגלגלי שיניים?", "qe": "Is a V-belt ratio exactly as precise as gears?", "wrong_h": "\"כן, היחס תמיד מדויק.\"", "wrong_e": "\"Yes, the ratio is always exact.\"", "ah": "לא. יש זחיל
